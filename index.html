    .group-label { font-size: 13px; font-weight: 800; color: #374151; letter-spacing: .02em; padding: 7px 12px; background: #e8e7e6; border-radius: 8px; margin-bottom: 10px; margin-top: 8px; display: block; }

    .gps-box.err  { background: #fef2f2; border-color: #f87171; }
    .gps-box.load { background: #f9fafb; border-color: #e5e7eb; }
    .gps-text { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .gps-box.ok   .gps-text { color: #15803d; }
    .gps-box.warn .gps-text { color: #a16207; }

    .gps-box.load .gps-text { color: #6b7280; }

    .login-form-box { width: 100%; max-width: 380px; }

    .sidebar { width: 420px; flex-shrink: 0; background: #232323; display: flex; flex-direction: column; padding: 48px 44px; position: relative; overflow: hidden; }

function haversine(la1,lo1,la2,lo2){
  const R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}
function gpsInfo(d){
  if(d===null) return{cls:"load",icon:"⏳",text:"GPS wird geladen...",ok:false};
  if(d<=150)   return{cls:"ok",  icon:"✓", text:d+" m — Bestätigt",ok:true};
  if(d<=300)   return{cls:"warn",icon:"⚠", text:d+" m — Warnung",ok:true};
  return            {cls:"err", icon:"✗", text:d+" m — Außerhalb",ok:false};
}
function fmtT(iso){try{return new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}catch{return "";}}

function Badge({status}){
  const m=status==="confirmed"?"badge-ok":status==="warning"?"badge-warn":"badge-err";
  const t=status==="confirmed"?"✓ GPS":status==="warning"?"⚠ GPS":"✗ GPS";
  return <span className={"badge "+m}>{t}</span>;
}

function DaySetupScreen({user,existing,onBack,onSave}){
  const [step,setStep]=useState("type");
  const [dayStatus,setDayStatus]=useState(existing?.day_status||"");
  const [startLoc,setStartLoc]=useState(existing?.start_location||"");
  const [overnight,setOvernight]=useState(existing?.overnight||"");
  const [eventName,setEventName]=useState(existing?.event_name||"");
  const [eventCity,setEventCity]=useState(existing?.event_city||"");
  const [note,setNote]=useState(existing?.note||"");

  const commit=(status,sl,on,en,ec,nt)=>onSave({user_id:user.id,date:TODAY,day_status:status,start_location:sl,overnight:on,event_name:en,event_city:ec,note:nt});
  const pickType=val=>{
    setDayStatus(val);
    const noExtra=["homeoffice","buro","schulung","inventur","sonstige"];
    const abs=["urlaub","krankheit","feiertag","fza","sonderurlaub","unbezahlt"];
    if(val==="aussendienst") setStep("start");
    else if(val==="messe")   setStep("messe");
    else if(noExtra.includes(val)) setStep("note");
    else if(abs.includes(val))     setStep("abs_confirm");
  };

  const content=()=>{
    if(step==="type") return (
      <div style={{maxWidth:520,width:"100%"}}>
        {DAY_STATUS_GROUPS.map(g=>(
          <div key={g.group} style={{marginBottom:12}}>

              {g.items.map(item=>(
                <button key={item.value} className={"result-btn"+(dayStatus===item.value?" active":"")} onClick={()=>pickType(item.value)}>
                  <span style={{fontSize:20,width:28,textAlign:"center",flexShrink:0}}>{item.icon}</span>
                  <div style={{flex:1}}>
                    <div className="result-lbl">{item.label}</div>
                    {item.note&&<div className="result-sub">{item.note}</div>}

                  {dayStatus===item.value&&<span className="result-check">✓</span>}

      <div style={{maxWidth:480,width:"100%"}}>
        <div className="card" style={{background:"#EFF6FC",border:"1px solid #BFDFEF",marginBottom:16}}>

            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {OVERNIGHT_TYPES.map(loc=>(
                <button key={loc.value} className={"result-btn"+(overnight===loc.value?" active":"")} onClick={()=>setOvernight(loc.value)}>
                  <span style={{fontSize:20,width:28,textAlign:"center"}}>{loc.icon}</span>
                  <span className="result-lbl">{loc.label}</span>
                  {overnight===loc.value&&<span className="result-check">✓</span>}
                </button>
              ))}
            </div>
          </div>
        </div>
        <button className="btn-primary" disabled={!eventName} onClick={()=>commit("messe","",overnight,eventName,eventCity,"")} style={{marginBottom:10}}>✓ BESTÄTIGEN</button>
        <button onClick={()=>setStep("type")} style={{width:"100%",background:"none",border:"1.5px solid #e5e7eb",borderRadius:13,padding:"13px 0",fontWeight:700,fontSize:16,color:"#374151",cursor:"pointer",fontFamily:"inherit"}}>← Zurück zur Auswahl</button>

  return (

/* ── SEARCH ── */
function CustomerSearchScreen({user,visits,onBack,onSelect}){
  const NK_KEY="actio_new_cust_"+user.id;
  const [q,setQ]=useState(""); const [pos,setPos]=useState(null);
  const [newCusts,setNewCusts]=useState(()=>ls(NK_KEY,[]));
  const [nkName,setNkName]=useState(""); const [nkCity,setNkCity]=useState("");
  const [editNkId,setEditNkId]=useState(null);
  useEffect(()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>setPos({lat:p.coords.latitude,lng:p.coords.longitude}),()=>{});},[]);
  useEffect(()=>{localStorage.setItem(NK_KEY,JSON.stringify(newCusts));},[newCusts]);
  const mine=CUSTOMERS.filter(c=>c.rep_id===user.id);
  const filtered=q.length>=1?mine.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||c.city.toLowerCase().includes(q.toLowerCase())||c.postal.includes(q)):[];
  const nearby=pos?[...mine].map(c=>({...c,_d:haversine(pos.lat,pos.lng,c.lat,c.lng)})).sort((a,b)=>a._d-b._d).slice(0,8):[];
  const saveNk=()=>{
    if(!nkName.trim())return;
    if(editNkId){setNewCusts(p=>p.map(c=>c.id===editNkId?{...c,name:nkName.trim(),city:nkCity.trim()}:c));setEditNkId(null);}
    else{setNewCusts(p=>[{id:"new_"+Date.now(),name:nkName.trim(),city:nkCity.trim(),postal:"",street:"",rep_id:user.id,lat:null,lng:null,isNew:true},...p]);}
    setNkName("");setNkCity("");
  };
  const editNk=c=>{setEditNkId(c.id);setNkName(c.name);setNkCity(c.city);};
  const cancelEdit=()=>{setEditNkId(null);setNkName("");setNkCity("");};
  const deleteNk=id=>{setNewCusts(p=>p.filter(c=>c.id!==id));if(editNkId===id)cancelEdit();};
  const Row=({c,dist})=>{
    const last=[...visits].filter(v=>v.rep_id===user.id&&v.customer_id===c.id).sort((a,b)=>b.confirmed_at.localeCompare(a.confirmed_at))[0];
    const tod=last?.confirmed_at?.startsWith(TODAY);
    return (
      <button className="cust-row" onClick={()=>onSelect(c)}>
        <div style={{width:46,height:46,borderRadius:"50%",background:"#EFF6FC",color:OG,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:16,flexShrink:0}}>{c.name.charAt(0)}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:16,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</div>
          <div style={{fontSize:14,color:"#9ca3af",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.postal} {c.city} · {c.street}</div>
        </div>
        <div style={{flexShrink:0,textAlign:"right"}}>
          {dist!==undefined&&<div style={{fontSize:14,color:"#9ca3af"}}>{dist<1000?dist+" m":(dist/1000).toFixed(1)+" km"}</div>}
          {tod&&<div style={{fontSize:13,color:"#16a34a",fontWeight:700}}>✓ dnes</div>}
        </div>
      </button>
    );
  };
  const nkBtnStyle={background:"none",border:"none",borderRadius:8,padding:"7px 10px",cursor:"pointer",fontSize:17,lineHeight:1};
  return (
    <div className="main-panel">
      <div className="panel-header">
        <button className="back-btn" onClick={onBack}>‹</button>
        <div className="panel-header-title">Kunden auswählen</div>
      </div>
      <div className="panel-body">
        <div style={{maxWidth:580,width:"100%"}}>
          <input autoFocus placeholder="Optiker, Stadt, PLZ suchen..." value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:16}}/>
          {q.length>=1?<>
            <div className="section-label">Ergebnisse ({filtered.length})</div>
            {filtered.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#d1d5db",fontSize:16}}>Kein Optiker gefunden</div>
            :<div style={{display:"flex",flexDirection:"column",gap:8}}>{filtered.map(c=><Row key={c.id} c={c}/>)}</div>}
          </>:<>
            {nearby.length>0&&<>
              <div className="section-label">Altkunde</div>
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:24}}>{nearby.map(c=><Row key={c.id} c={c} dist={c._d}/>)}</div>
            </>}
            {nearby.length===0&&<div style={{textAlign:"center",padding:"32px 0 24px",color:"#d1d5db"}}><div style={{fontSize:36,marginBottom:10}}>🔍</div><div style={{fontSize:16}}>GPS lädt oder nicht verfügbar</div></div>}
            <div className="section-label">Neukunde</div>
            <div style={{background:"#f9fafb",borderRadius:14,padding:"16px",marginBottom:8,border:"1.5px solid #e5e7eb"}}>
              <input placeholder="Geschäftsname" value={nkName} onChange={e=>setNkName(e.target.value)} style={{marginBottom:10}} onKeyDown={e=>e.key==="Enter"&&saveNk()}/>
              <input placeholder="Stadt & PLZ (z. B. München 80333)" value={nkCity} onChange={e=>setNkCity(e.target.value)} style={{marginBottom:12}} onKeyDown={e=>e.key==="Enter"&&saveNk()}/>
              <div style={{display:"flex",gap:8}}>
                <button onClick={saveNk} disabled={!nkName.trim()||!nkCity.trim()} style={{flex:1,background:(nkName.trim()&&nkCity.trim())?OG:"#d1d5db",color:"white",border:"none",borderRadius:8,padding:"11px",fontWeight:700,cursor:(nkName.trim()&&nkCity.trim())?"pointer":"default",fontFamily:"inherit",fontSize:15,transition:"background .2s"}}>
                  {editNkId?"Speichern ✓":"Hinzufügen +"}
                </button>
                {editNkId&&<button onClick={cancelEdit} style={{background:"#e5e7eb",border:"none",borderRadius:8,padding:"11px 16px",cursor:"pointer",fontFamily:"inherit",fontWeight:600,fontSize:14}}>Abbrechen</button>}
              </div>
            </div>
            {newCusts.length>0&&<>
              <div className="section-label" style={{marginTop:20}}>Neue Kunden ({newCusts.length})</div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {newCusts.map(c=>(
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:6,background:"white",borderRadius:12,border:editNkId===c.id?"2px solid "+OG:"1.5px solid #e5e7eb",padding:"12px 14px",boxSizing:"border-box"}}>
                    <button onClick={()=>onSelect(c)} style={{flex:1,background:"none",border:"none",cursor:"pointer",textAlign:"left",fontFamily:"inherit",padding:0}}>
                      <div style={{fontWeight:700,fontSize:15,color:"#111827"}}>{c.name}</div>
                      {c.city&&<div style={{fontSize:13,color:"#9ca3af",marginTop:2}}>{c.city}</div>}
                    </button>
                    <button onClick={()=>editNk(c)} title="Bearbeiten" style={{...nkBtnStyle,background:"#EFF6FC"}}>✏️</button>
                    <button onClick={()=>deleteNk(c.id)} title="Löschen" style={{...nkBtnStyle,background:"#FEF2F2"}}>🗑️</button>
                  </div>
                ))}
              </div>
            </>}
          </>}
        </div>
      </div>
    </div>
  );
}

/* ── CONFIRM ── */
function VisitConfirmScreen({user,customer,onBack,onConfirm}){
  const [pos,setPos]=useState(null); const [gpsErr,setGpsErr]=useState(null); const [loading,setLoading]=useState(true);
  const [result,setResult]=useState(""); const [units,setUnits]=useState(""); const [note,setNote]=useState("");
  const [saving,setSaving]=useState(false); const [done,setDone]=useState(false);
  useEffect(()=>{
    if(!navigator.geolocation){setGpsErr("GPS nicht verfügbar");setLoading(false);return;}
    navigator.geolocation.getCurrentPosition(
      p=>{setPos({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)});setLoading(false);},
      ()=>{setGpsErr("GPS nicht verfügbar");setLoading(false);},
      {enableHighAccuracy:true,timeout:12000}
    );
  },[]);
  const dist=(pos&&!customer.isNew&&customer.lat!=null&&customer.lng!=null)?haversine(pos.lat,pos.lng,customer.lat,customer.lng):null;
  const noGps=customer.isNew||customer.lat==null;
  const gi=noGps
    ?(loading?{cls:"load",icon:"⏳",text:"GPS wird geladen...",ok:false}
      :pos?{cls:"ok",icon:"✅",text:"GPS-Standort erfasst",ok:true}
      :{cls:"err",icon:"⚠️",text:"GPS nicht verfügbar",ok:false})
    :gpsInfo(loading?null:dist);
  const vs=noGps?(pos?"confirmed":"unknown"):dist===null?"unknown":dist<=150?"confirmed":dist<=300?"warning":"rejected";
  const go=()=>{
    if(!result||saving)return; setSaving(true);
    setTimeout(()=>{onConfirm({id:Date.now(),rep_id:user.id,customer_id:customer.id,confirmed_at:new Date().toISOString(),distance:dist??9999,status:vs,result,units:result==="order"?(parseInt(units)||0):0,note});setDone(true);},900);
  };
  if(done) return (
    <div className="main-panel" style={{alignItems:"center",justifyContent:"center",textAlign:"center"}}>
      <div style={{padding:40}}>
        <div style={{fontSize:72,marginBottom:16}}>✅</div>
        <div style={{fontSize:28,fontWeight:900,color:"#111827",marginBottom:4}}>Gespeichert!</div>
        <div style={{fontSize:16,color:"#6b7280"}}>{customer.name}</div>
        {dist!==null&&!customer.isNew&&<div style={{fontSize:14,color:"#9ca3af",marginTop:4}}>GPS-Entfernung: {dist} m</div>}
      </div>
    </div>
  );
  return (
    <div className="main-panel">
      <div className="panel-header">
        <button className="back-btn" onClick={onBack}>‹</button>
        <div>
          <div className="panel-header-title">Besuch bestätigen</div>
          <div className="panel-header-sub">{customer.name}{customer.city?` · ${customer.city}`:""}</div>
        </div>
      </div>
      <div className="panel-body">
        <div style={{maxWidth:520,width:"100%",display:"flex",flexDirection:"column",gap:14}}>
          <div className={"gps-box "+gi.cls}>
            <div className="gps-text"><span style={{fontSize:18}}>{gi.icon}</span><span>{gpsErr||gi.text}</span></div>
            {pos&&<div style={{fontSize:14,color:"#6b7280",marginTop:4}}>GPS-Genauigkeit: ±{pos.acc} m</div>}
            {!customer.isNew&&dist!==null&&dist>300&&<div style={{fontSize:14,color:"#b91c1c",marginTop:6,fontWeight:600}}>Sie sind zu weit entfernt. Der Besuch wird zur Überprüfung markiert.</div>}
          </div>
          <div>
            <div className="section-label">Besuchsergebnis *</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {RESULTS.map(r=>(
                <button key={r.value} className={"result-btn"+(result===r.value?" active":"")} onClick={()=>setResult(r.value)}>
                  <span style={{fontSize:18,width:24,textAlign:"center"}}>{r.icon}</span>
                  <span className="result-lbl">{r.label}</span>
                  {result===r.value&&<span className="result-check">✓</span>}
                </button>
              ))}
            </div>
          </div>
          <div>
            <div className="section-label">Notiz (optional)</div>
            <textarea rows={2} placeholder="Kurze Notiz…" value={note} onChange={e=>setNote(e.target.value)} style={{resize:"none"}}/>
          </div>
          <button className="btn-primary" onClick={go} disabled={!result||saving}
            style={{background:(!result||saving)?"#e5e7eb":OG,color:(!result||saving)?"#9ca3af":"white",cursor:(!result||saving)?"not-allowed":"pointer"}}>
            {saving?"⏳ Wird gespeichert…":"KUNDENBESUCH BESTÄTIGEN"}
          </button>
        </div>
      </div>
    </div>
  );
}

                        <div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:10,height:10,background:"#16a34a",borderRadius:2}}/><span style={{fontSize:11,color:"#6b7280"}}>Bestellungen</span></div>
                      </div>
                    </div>
                    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
                      {[0,0.25,0.5,0.75,1].map(f=>{
                        const y=pT+ph-ph*f;
                        return (
                          <g key={f}>
                            <line x1={pL} y1={y} x2={W-pR} y2={y} stroke="#f3f4f6" strokeWidth="1"/>
                            {f>0&&<text x={pL-4} y={y+4} textAnchor="end" fontSize="9" fill="#9ca3af">{Math.round(maxV*f)}</text>}
                          </g>
                        );
                      })}
                      {mdays.map((day,i)=>{
                        const v=day.dayVisits.length;
                        const o=day.dayVisits.filter(x=>x.result==="order").length;
                        const cx=pL+i*slotW+slotW/2;
                        const vh=v>0?Math.max(2,ph*v/maxV):0;
                        const oh=o>0?Math.max(2,ph*o/maxV):0;
                        const isWE=day.dow===0||day.dow===6;
                        const showLbl=i===0||(i+1)%5===0||i===n-1;
                        return (
                          <g key={day.dateStr} onMouseEnter={e=>setHoveredDay({dateStr:day.dateStr,v,o,cx:e.clientX,cy:e.clientY})} onMouseLeave={()=>setHoveredDay(null)} style={{cursor:"pointer"}}>
                            {isWE&&<rect x={pL+i*slotW} y={pT} width={slotW} height={ph} fill="#f9fafb"/>}
                            <rect x={pL+i*slotW} y={pT} width={slotW} height={ph+pB} fill="transparent"/>
                            <rect x={cx-bw-1} y={pT+ph-vh} width={bw} height={vh} fill="#e87722" rx="2"/>
                            <rect x={cx+1} y={pT+ph-oh} width={bw} height={oh} fill="#16a34a" rx="2"/>
                            {showLbl&&<text x={cx} y={H-6} textAnchor="middle" fontSize="9" fill="#9ca3af">{day.d}</text>}
                          </g>
                        );
                      })}
                      <line x1={pL} y1={pT+ph} x2={W-pR} y2={pT+ph} stroke="#e5e7eb" strokeWidth="1"/>
                    </svg>
                  </div>
                  {/* ── Line chart: Konversionsrate ── */}
                  <div className="chart-scroll" style={{background:"white",borderRadius:14,border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",padding:"16px 20px",marginTop:10}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                      <div style={{fontSize:13,fontWeight:700,color:"#374151"}}>Konversionsrate</div>
                      <div style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:10,height:10,background:"#6366f1",borderRadius:99}}/><span style={{fontSize:11,color:"#6b7280"}}>Rate (%)</span></div>
                    </div>
                    <svg viewBox={`0 0 ${W} ${lineH}`} style={{width:"100%",height:"auto",display:"block"}}>
                      {[0,25,50,75,100].map(pct=>{
                        const y=linePT+linePH-(linePH*pct/100);
                        return (
                          <g key={pct}>
                            <line x1={pL} y1={y} x2={W-pR} y2={y} stroke="#f3f4f6" strokeWidth="1"/>
                            <text x={pL-4} y={y+4} textAnchor="end" fontSize="9" fill="#9ca3af">{pct}%</text>
                          </g>
                        );
                      })}
                      {linePoints.length>1&&<polyline points={linePoints.map(p=>`${p.x},${p.y}`).join(" ")} fill="none" stroke="#6366f1" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>}
                      {linePoints.map(p=>(
                        <circle key={p.dateStr} cx={p.x} cy={p.y} r="3" fill="#6366f1" stroke="white" strokeWidth="1.5"/>
                      ))}
                      <line x1={pL} y1={linePT+linePH} x2={W-pR} y2={linePT+linePH} stroke="#e5e7eb" strokeWidth="1"/>
                    </svg>
                  </div>
                </div>
              );
            })()}
            {/* ── HEATMAP ── */}
            {chartView==="heatmap"&&(()=>{
              const [hy,hm]=repMonth.split("-").map(Number);
              const daysInMonth=new Date(hy,hm,0).getDate();
              const firstDow=(new Date(hy,hm-1,1).getDay()+6)%7;
              const wdLabels=["Po","Út","St","Čt","Pá","So","Ne"];
              const heatColor=cnt=>cnt===0?"#f3f4f6":cnt<=2?"#fed7aa":cnt<=5?"#fb923c":"#e87722";
              const cells=[];
              for(let i=0;i<firstDow;i++) cells.push(null);
              for(let d=1;d<=daysInMonth;d++){
                const dateStr=`${hy}-${String(hm).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
                const cnt=visits.filter(v=>v.confirmed_at.startsWith(dateStr)).length;
                const ord=visits.filter(v=>v.confirmed_at.startsWith(dateStr)&&v.result==="order").length;
                cells.push({d,dateStr,cnt,ord});
              }
              const weeks=[];
              for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
              return (
                <div>
                  {hoveredDay&&(
                    <div style={{position:"fixed",left:hoveredDay.cx,top:hoveredDay.cy-10,transform:"translate(-50%,-100%)",background:"white",border:"1.5px solid #e87722",borderRadius:8,padding:"8px 12px",fontSize:12,fontWeight:600,zIndex:1000,pointerEvents:"none",boxShadow:"0 4px 12px rgba(0,0,0,.15)",whiteSpace:"nowrap"}}>
                      <div style={{color:"#374151",marginBottom:3}}>{hoveredDay.dateStr}</div>
                      <div style={{display:"flex",gap:10}}>
                        <span style={{color:"#e87722"}}>● {hoveredDay.v} Besuche</span>
                        <span style={{color:"#16a34a"}}>● {hoveredDay.o} Best.</span>
                      </div>
                    </div>
                  )}
                  <div style={{background:"white",borderRadius:14,border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",padding:"16px 20px",marginTop:12}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#374151",marginBottom:12}}>Heatmap — {monthLabel()}</div>
                    <div className="heatmap-scroll"><div className="heatmap-hd" style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
                      {wdLabels.map(d=><div key={d} style={{fontSize:11,fontWeight:700,color:"#9ca3af",textAlign:"center"}}>{d}</div>)}
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:4}}>
                      {weeks.map((week,wi)=>(
                        <div key={wi} className="heatmap-week" style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
                          {Array.from({length:7},(_,ci)=>{
                            const cell=week[ci];
                            if(!cell) return <div key={ci}/>;
                            return (
                              <div key={cell.dateStr}
                                style={{aspectRatio:"1",background:heatColor(cell.cnt),borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:cell.cnt>2?"#7c2d00":"#6b7280",cursor:"default"}}
                                onMouseEnter={e=>setHoveredDay({dateStr:cell.dateStr,v:cell.cnt,o:cell.ord,cx:e.clientX,cy:e.clientY})}
                                onMouseLeave={()=>setHoveredDay(null)}
                              >{cell.d}</div>
                            );
                          })}
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex",gap:8,marginTop:12,alignItems:"center"}}>
                      <span style={{fontSize:11,color:"#9ca3af"}}>Weniger</span>
                      {["#f3f4f6","#fed7aa","#fb923c","#e87722"].map((c,i)=><div key={i} style={{width:14,height:14,background:c,borderRadius:3}}/>)}
                      <span style={{fontSize:11,color:"#9ca3af"}}>Mehr</span>
                    </div></div>
                  </div>
                </div>
              );
            })()}
            {/* ── MANAGER CALENDAR ── */}
            {chartView==="calendar"&&(()=>{
              const [hy,hm]=repMonth.split("-").map(Number);
              const daysInMonth=new Date(hy,hm,0).getDate();
              const firstDow=(new Date(hy,hm-1,1).getDay()+6)%7;
              const wdLabelsMgr=["Mo","Di","Mi","Do","Fr","Sa","So"];
              const hColorMgr=cnt=>cnt===0?"#f3f4f6":cnt<=2?"#fed7aa":cnt<=5?"#fb923c":"#e87722";
              const cellsMgr=[];
              for(let i=0;i<firstDow;i++) cellsMgr.push(null);
              for(let d=1;d<=daysInMonth;d++){
                const dateStr=`${hy}-${String(hm).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
                const dv=visits.filter(v=>v.confirmed_at.startsWith(dateStr));
                cellsMgr.push({d,dateStr,dv});
              }
              const weeksMgr=[];for(let i=0;i<cellsMgr.length;i+=7)weeksMgr.push(cellsMgr.slice(i,i+7));
              const selDVMgr=selectedManagerDay?[...visits.filter(v=>v.confirmed_at.startsWith(selectedManagerDay))].sort((a,b)=>a.confirmed_at.localeCompare(b.confirmed_at)):[];
              return(
                <div>
                  <div style={{background:"white",borderRadius:14,border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",padding:"16px 20px",marginTop:12}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#374151",marginBottom:12}}>Kalender — {monthLabel()}</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
                      {wdLabelsMgr.map(d=><div key={d} style={{fontSize:11,fontWeight:700,color:"#9ca3af",textAlign:"center"}}>{d}</div>)}
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:4}}>
                      {weeksMgr.map((week,wi)=>(
                        <div key={wi} style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
                          {Array.from({length:7},(_,ci)=>{
                            const cell=week[ci];
                            if(!cell) return <div key={ci}/>;
                            const cnt=cell.dv.length;
                            const isSel=selectedManagerDay===cell.dateStr;
                            const isT=cell.dateStr===TODAY;
                            return(
                              <div key={cell.dateStr} onClick={()=>setSelectedManagerDay(isSel?null:cell.dateStr)}
                                style={{aspectRatio:"1",background:isSel?"#2C8CD1":hColorMgr(cnt),borderRadius:8,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",border:isT?"2px solid #2C8CD1":"2px solid transparent",transition:"all .1s"}}>
                                <div style={{fontSize:11,fontWeight:700,color:isSel?"white":cnt>0?"#7c2d00":"#6b7280"}}>{cell.d}</div>
                                {cnt>0&&<div style={{fontSize:10,fontWeight:900,color:isSel?"white":"#c2410c"}}>{cnt}</div>}
                              </div>
                            );
                          })}
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex",gap:8,marginTop:12,alignItems:"center"}}>
                      <span style={{fontSize:11,color:"#9ca3af"}}>Weniger</span>
                      {["#f3f4f6","#fed7aa","#fb923c","#e87722"].map((c,i)=><div key={i} style={{width:14,height:14,background:c,borderRadius:3}}/>)}
                      <span style={{fontSize:11,color:"#9ca3af"}}>Mehr</span>
                    </div>
                  </div>
                  {selectedManagerDay&&(
                    <div style={{background:"white",borderRadius:14,border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",padding:"16px 20px",marginTop:10}}>
                      <div style={{fontSize:13,fontWeight:700,color:"#374151",marginBottom:12}}>
                        {new Date(selectedManagerDay+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
                      </div>
                      {selDVMgr.length===0?(
                        <div style={{textAlign:"center",padding:"16px",color:"#9ca3af",fontSize:15}}>Keine Besuche</div>
                      ):(
                        <div style={{display:"flex",flexDirection:"column",gap:8}}>
                          {selDVMgr.map(v=>{
                            const c=CUSTOMERS.find(x=>x.id===v.customer_id);
                            const r=USERS.find(u=>u.id===v.rep_id);
                            return(
                              <div key={v.id} className="card" style={{display:"flex",alignItems:"center",gap:12}}>
                                <div style={{fontSize:22,width:30,textAlign:"center",flexShrink:0}}>{ri(v.result)}</div>
                                <div style={{flex:1,minWidth:0}}>
                                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                                    <div style={{width:22,height:22,borderRadius:"50%",background:OG,color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:900,flexShrink:0}}>{r?.initials||"?"}</div>
                                    <div style={{fontWeight:700,fontSize:13,color:"#374151"}}>{r?.name||"?"}</div>
                                  </div>
                                  <div style={{fontWeight:700,fontSize:15,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c?.name||v.customer_id}</div>
                                  <div style={{fontSize:13,color:"#9ca3af"}}>{fmtT(v.confirmed_at)} · {rl(v.result)}{v.note?` · ${v.note}`:""}</div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })()}
            {/* ── CHART 2: Vertreter im Überblick (progress bars + trends) ── */}
            {chartView!=="calendar"&&(()=>{
              const now=new Date();
              const dow=now.getDay();
              const daysFromMon=dow===0?6:dow-1;
              const daysCount=daysFromMon+1;
              const weekVisits=(repId,offsetWeeks)=>{
                let total=0;
                const base=new Date(now);
                base.setDate(now.getDate()-daysFromMon-offsetWeeks*7);
                for(let i=0;i<daysCount;i++){
                  const d=new Date(base);d.setDate(base.getDate()+i);
                  total+=visits.filter(v=>v.rep_id===repId&&v.confirmed_at.startsWith(d.toISOString().slice(0,10))).length;
                }
                return total;
              };
              const repStats=reps.map(r=>({
                ...r,
                totalV:mdays.reduce((s,day)=>s+day.dayVisits.filter(v=>v.rep_id===r.id).length,0),
                totalO:mdays.reduce((s,day)=>s+day.dayVisits.filter(v=>v.rep_id===r.id&&v.result==="order").length,0),
                thisW:weekVisits(r.id,0),
                lastW:weekVisits(r.id,1),
              }));
              const maxV=Math.max(1,...repStats.map(r=>r.totalV));
              return (
                <div style={{background:"white",borderRadius:14,border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",padding:"16px 20px",marginTop:12,marginBottom:4}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#374151",marginBottom:14}}>Vertreter im Überblick</div>
                  {repStats.map((r,ri)=>{
                    const conv=r.totalV>0?Math.round(r.totalO/r.totalV*100):0;
                    const vPct=Math.round(r.totalV/maxV*100);
                    const diff=r.lastW===0?(r.thisW>0?100:0):Math.round((r.thisW-r.lastW)/r.lastW*100);
                    const tDir=diff>5?"up":diff<-5?"down":"flat";
                    return (
                      <div key={r.id} style={{marginBottom:ri<repStats.length-1?16:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
                          <div style={{width:28,height:28,borderRadius:"50%",background:OG,color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,flexShrink:0}}>{r.initials}</div>
                          <div style={{flex:1,fontWeight:700,fontSize:14,color:"#111827"}}>{r.name}<span style={{fontSize:12,fontWeight:700,marginLeft:8,color:tDir==="up"?"#16a34a":tDir==="down"?"#dc2626":"#9ca3af"}}>{tDir==="up"?"↑":tDir==="down"?"↓":"→"} {diff>0?"+":""}{diff}%</span></div>
                          <div style={{fontSize:12,color:"#6b7280"}}><span style={{fontWeight:700,color:"#e87722"}}>{r.totalV}</span> Besuche</div>
                          <div style={{fontSize:12,fontWeight:700,color:"#16a34a",minWidth:60,textAlign:"right"}}>{conv>0?conv+"% Konv.":"—"}</div>
                        </div>
                        <div style={{display:"flex",flexDirection:"column",gap:3}}>
                          <div style={{height:9,background:"#f3f4f6",borderRadius:5,overflow:"hidden"}}>
                            <div style={{height:"100%",width:vPct+"%",background:"#e87722",borderRadius:5}}/>
                          </div>
                          <div style={{height:6,background:"#f3f4f6",borderRadius:3,overflow:"hidden"}}>
                            <div style={{height:"100%",width:conv+"%",background:"#16a34a",borderRadius:3}}/>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>
        </div>
      </div>
    );
  }

  // Default: today
  return (
    <div className="main-panel">
      <div className="panel-header">
        <div style={{flex:1}}>
          <div className="panel-header-title">Dashboard</div>
          <div className="panel-header-sub">{new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setView("week")} style={{background:view==="week"?"#4b5563":"#f3f4f6",border:"none",borderRadius:8,padding:"7px 13px",cursor:"pointer",fontWeight:700,fontSize:13,color:view==="week"?"white":"#374151",fontFamily:"inherit"}}>7 Tage</button>
          <button onClick={()=>setView("month")} style={{background:OG,border:"none",borderRadius:8,padding:"7px 13px",cursor:"pointer",fontWeight:700,fontSize:13,color:"white",fontFamily:"inherit"}}>Monatsreport</button>
        </div>
      </div>
      <div className="panel-body">
        <div style={{maxWidth:680,width:"100%"}}>
        <div className="stats-grid-4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:28}}>
          {[{l:"Besuche",v:tot.v,c:OG},{l:"Bestellungen",v:tot.o,c:"#16a34a"},{l:"Konversionsrate",v:tot.conv,c:"#6366f1"},{l:"Zur Überprüfung",v:tot.f,c:"#dc2626"}].map(s=>(
            <div key={s.l} className="stat-box"><div className="stat-num" style={{color:s.c,fontSize:typeof s.v==="string"?22:28}}>{s.v}</div><div className="stat-lbl">{s.l}</div></div>
          ))}
        </div>
        <div className="section-label">Teamübersicht — heute</div>
        <div style={{background:"white",borderRadius:14,overflow:"hidden",border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",marginBottom:24}}>
          <div className="team-today-hd" style={{display:"grid",gridTemplateColumns:"1.5fr 1.5fr 80px 100px",padding:"10px 16px",background:"#f9fafb",borderBottom:"1px solid #f0f0f0"}}>
            {["Vertreter","Status","Besuche","Übernachtung"].map(h=>(
              <div key={h} style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:".08em"}}>{h}</div>
            ))}
          </div>
          {stats.map((r,i)=>(
            <button key={r.id} onClick={()=>setSelRep(r)}
              className="team-today-row" style={{display:"grid",gridTemplateColumns:"1.5fr 1.5fr 80px 100px",width:"100%",padding:"13px 16px",background:"white",border:"none",borderBottom:i<stats.length-1?"1px solid #f9fafb":"none",cursor:"pointer",textAlign:"left",fontFamily:"inherit",transition:"background .1s",alignItems:"center"}}
              onMouseOver={e=>e.currentTarget.style.background="#f9fafb"} onMouseOut={e=>e.currentTarget.style.background="white"}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:32,height:32,borderRadius:"50%",background:OG,color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:900,flexShrink:0}}>{r.initials}</div>
                <div><div style={{fontSize:15,fontWeight:700,color:"#111827"}}>{r.name}</div><div style={{fontSize:13,color:"#9ca3af"}}>{r.territory}</div></div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:16}}>{r.ds?.icon||"❓"}</span>
                <span style={{fontSize:15,color:"#374151"}}>{r.statusText}</span>
              </div>
              <div style={{textAlign:"center",fontSize:17,fontWeight:900,color:r.repVisits.length>0?OG:"#d1d5db"}}>
                {r.wd?.day_status==="aussendienst"?r.repVisits.length:"—"}
              </div>
              <div className="team-col-overnight" style={{fontSize:14,color:"#6b7280"}}>{r.overnight||"—"}</div>
            </button>
          ))}
        </div>
        {tot.f>0&&<>
          <div className="section-label" style={{color:"#f87171"}}>⚠ Zur Überprüfung ({tot.f})</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {tod.filter(v=>v.status==="rejected").map(v=>{
              const c=CUSTOMERS.find(c=>c.id===v.customer_id);
              const r=USERS.find(u=>u.id===v.rep_id);
              return (
                <div key={v.id} style={{background:"#fef2f2",border:"1.5px solid #fca5a5",borderRadius:12,padding:12}}>
                  <div style={{fontSize:16,fontWeight:700,color:"#b91c1c"}}>{r?.name} · {c?.name}</div>
                  <div style={{fontSize:14,color:"#ef4444"}}>{fmtT(v.confirmed_at)} · {v.distance} m · {rl(v.result)}</div>
                </div>
              );
            })}
          </div>
        </>}
        {auditLogs.length>0&&<>
          <div className="section-label" style={{marginTop:24}}>Änderungen</div>
          <div style={{background:"white",borderRadius:14,border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",overflow:"hidden",marginBottom:8}}>
            {auditLogs.map((log,i)=>{
              const rep=USERS.find(u=>u.email===log.repEmail);
              const c=log.before?CUSTOMERS.find(x=>x.id===log.before.customer_id):null;
              const ts=log.timestamp?new Date(log.timestamp).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"-";
              return(
                <div key={log.id||i} style={{padding:"11px 16px",borderBottom:i<auditLogs.length-1?"1px solid #f9fafb":"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                    <span style={{fontSize:14,fontWeight:700,color:log.action==="deleted"?"#dc2626":"#e87722"}}>{log.action==="deleted"?"🗑️ gelöscht":"✏️ bearbeitet"}</span>
                    <span style={{fontSize:13,color:"#374151",fontWeight:600}}>{rep?.name||log.repEmail}</span>
                    <span style={{marginLeft:"auto",fontSize:12,color:"#9ca3af",flexShrink:0}}>{ts}</span>
                  </div>
                  <div style={{fontSize:13,color:"#6b7280"}}>
                    {c?.name||log.before?.customer_id||"?"}
                    {log.before?` · ${rl(log.before.result)}`:""}
                    {log.action==="edited"&&log.after&&log.before?.result!==log.after?.result?<span style={{color:"#374151",fontWeight:700}}> → {rl(log.after.result)}</span>:""}
                  </div>
                </div>
              );
            })}
          </div>
        </>}
        </div>
      </div>
    </div>
  );
}

/* ── ROOT ── */
function ls(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}

/* Načte workdays z posledních 90 dní z localStorage (fallback režim) */
function loadAllLocalWorkdays(){
  const result=[];
  for(let i=0;i<90;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().split("T")[0];
    const wds=ls("actio_wd_"+ds,[]);
    result.push(...wds);
  }
  return result;
}

function App(){
  const USE_FB=window.USE_FIREBASE;
  const DB=window.db;

  const savedId=localStorage.getItem("actio_uid");
  const savedUser=savedId?USERS.find(u=>u.id===parseInt(savedId)):null;
  const [screen,setScreen]=useState(savedUser?(savedUser.role==="manager"?"dashboard":"home"):"login");
  const [user,setUser]=useState(savedUser||null);
  const [visits,setVisits]=useState(()=>{
    if(USE_FB) return [];
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);
    const cutStr=cutoff.toISOString().split("T")[0];
    return ls("actio_visits",INIT_VISITS).filter(v=>v.confirmed_at.split("T")[0]>=cutStr);
  });
  const [workdays,setWorkdays]=useState(()=>USE_FB?[]:loadAllLocalWorkdays());
  const [cust,setCust]=useState(null);
  const [fbLoading,setFbLoading]=useState(USE_FB);
  const [auditLogs,setAuditLogs]=useState([]);

  /* ── Firebase real-time listenery ── */
  useEffect(()=>{
    if(!USE_FB||!DB) return;
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);
    const cutStr=cutoff.toISOString().split("T")[0];

    const unsubV=DB.collection('visits').onSnapshot(snap=>{
      setVisits(snap.docs.map(d=>({...d.data(),id:d.id})).filter(v=>v.confirmed_at.split("T")[0]>=cutStr));
      setFbLoading(false);
    },err=>{console.error("[Iris] visits listener:",err);setFbLoading(false);});

    const unsubW=DB.collection('workdays').onSnapshot(snap=>{
      setWorkdays(snap.docs.map(d=>d.data()));
    },err=>{console.error("[Iris] workdays listener:",err);});

    const unsubA=DB.collection('audit_log').orderBy('timestamp','desc').limit(20).onSnapshot(snap=>{
      setAuditLogs(snap.docs.map(d=>({...d.data(),id:d.id})));
    },err=>{console.error("[Iris] audit_log listener:",err);});

    return()=>{unsubV();unsubW();unsubA();};
  },[]);

  /* ── localStorage persistence (jen v fallback režimu) ── */
  useEffect(()=>{
    if(USE_FB) return;
    localStorage.setItem("actio_visits",JSON.stringify(visits));
  },[visits]);
  useEffect(()=>{
    if(USE_FB) return;
    const byDate={};
    workdays.forEach(w=>{if(!byDate[w.date])byDate[w.date]=[];byDate[w.date].push(w);});
    Object.entries(byDate).forEach(([date,wds])=>localStorage.setItem("actio_wd_"+date,JSON.stringify(wds)));
  },[workdays]);

  const login=u=>{localStorage.setItem("actio_uid",u.id);setUser(u);setScreen(u.role==="manager"?"dashboard":"home");};
  const logout=()=>{localStorage.removeItem("actio_uid");setUser(null);setScreen("login");};

  const addVisit=v=>{
    if(USE_FB&&DB){
      const {id:_,...data}=v;
      DB.collection('visits').add(data).catch(e=>console.error("[Iris] addVisit:",e));
    } else {
      setVisits(p=>[v,...p]);
    }
    setScreen("home");
  };
  const deleteVisit=id=>{
    if(USE_FB&&DB){
      DB.collection('visits').doc(String(id)).delete().catch(e=>console.error("[Iris] deleteVisit:",e));
    } else {
      setVisits(p=>p.filter(v=>v.id!==id));
    }
  };
  const editVisit=(id,changes)=>{
    if(USE_FB&&DB){
      DB.collection('visits').doc(String(id)).update(changes).catch(e=>console.error("[Iris] editVisit:",e));
    } else {
      setVisits(p=>p.map(v=>v.id===id?{...v,...changes}:v));
    }
  };
  const deleteVisitAudit=(id,before)=>{
    if(USE_FB&&DB){
      DB.collection('audit_log').add({repEmail:user.email,action:'deleted',timestamp:Date.now(),visitId:String(id),before,after:null}).catch(e=>console.error("[Iris] auditLog:",e));
      DB.collection('visits').doc(String(id)).delete().catch(e=>console.error("[Iris] deleteVisitAudit:",e));
    } else {
      setVisits(p=>p.filter(v=>v.id!==id));
    }
  };
  const editVisitAudit=(id,changes,before)=>{
    if(USE_FB&&DB){
      DB.collection('audit_log').add({repEmail:user.email,action:'edited',timestamp:Date.now(),visitId:String(id),before,after:{...before,...changes}}).catch(e=>console.error("[Iris] auditLog:",e));
      DB.collection('visits').doc(String(id)).update(changes).catch(e=>console.error("[Iris] editVisitAudit:",e));
    } else {
      setVisits(p=>p.map(v=>v.id===id?{...v,...changes}:v));
    }
  };

  const myWorkday=user?workdays.find(w=>w.user_id===user.id&&w.date===TODAY):null;

  const saveWorkday=wd=>{
    const wdData={...wd,id:Date.now()};
    if(USE_FB&&DB){
      const docId=`${wd.user_id}_${wd.date}`;
      DB.collection('workdays').doc(docId).set(wdData).catch(e=>console.error("[Iris] saveWorkday:",e));
      /* Optimistický update — okamžitá odezva UI */
      setWorkdays(p=>[...p.filter(w=>!(w.user_id===wd.user_id&&w.date===wd.date)),wdData]);
    } else {
      setWorkdays(p=>[...p.filter(w=>!(w.user_id===user.id&&w.date===TODAY)),wdData]);
    }
    setScreen("home");
  };
  const saveOvernight=overnight=>{
    if(USE_FB&&DB){
      const docId=`${user.id}_${TODAY}`;
      DB.collection('workdays').doc(docId).update({overnight}).catch(e=>console.error("[Iris] saveOvernight:",e));
    }
    setWorkdays(p=>p.map(w=>(w.user_id===user.id&&w.date===TODAY)?{...w,overnight}:w));
    setScreen("home");
  };

  if(fbLoading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#232323",color:"rgba(255,255,255,.75)",fontSize:16,fontWeight:700,fontFamily:"Montserrat,sans-serif",gap:12}}>⏳ Verbindung wird hergestellt…</div>;
  if(screen==="login") return <LoginScreen onLogin={login}/>;

  return (
    <div className="app-root">
      <Sidebar user={user} workday={myWorkday} onLogout={logout} onSetDay={()=>setScreen("dayset")}/>
      {screen==="home"      && <HomeScreen user={user} visits={visits} workday={myWorkday} onNewVisit={()=>setScreen("search")} onSetOvernight={()=>setScreen("overnight")} onDeleteVisit={deleteVisit} onEditVisit={editVisit} onDeleteVisitAudit={deleteVisitAudit} onEditVisitAudit={editVisitAudit}/>}
      {screen==="dayset"    && <DaySetupScreen user={user} existing={myWorkday} onBack={()=>setScreen("home")} onSave={saveWorkday}/>}
      {screen==="overnight" && <OvernightScreen workday={myWorkday} onBack={()=>setScreen("home")} onSave={saveOvernight}/>}
      {screen==="search"    && <CustomerSearchScreen user={user} visits={visits} onBack={()=>setScreen("home")} onSelect={c=>{setCust(c);setScreen("confirm");}}/>}
      {screen==="confirm"   && <VisitConfirmScreen user={user} customer={cust} onBack={()=>setScreen("search")} onConfirm={addVisit}/>}
      {screen==="dashboard" && <DashboardScreen visits={visits} workdays={workdays} auditLogs={auditLogs}/>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
<script>
// PWA icon + manifest
(function(){
  // Generate icon via canvas
  const c=document.createElement("canvas");
  c.width=c.height=512;
  const ctx=c.getContext("2d");
  // Dark rounded background (same as sidebar #232323)
  const r=90;
  ctx.fillStyle="#232323";
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(512-r,0);ctx.quadraticCurveTo(512,0,512,r);
  ctx.lineTo(512,512-r);ctx.quadraticCurveTo(512,512,512-r,512);
  ctx.lineTo(r,512);ctx.quadraticCurveTo(0,512,0,512-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();ctx.fill();
  // Subtle circle decoration (like sidebar ::before)
  ctx.fillStyle="rgba(255,255,255,.07)";
  ctx.beginPath();ctx.arc(420,90,200,0,Math.PI*2);ctx.fill();
  // "Iris" centered
  ctx.fillStyle="white";
  ctx.font="bold 140px Montserrat,Arial,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("Iris",256,256);
  const iconUrl=c.toDataURL("image/png");
  document.getElementById("pwa-icon").href=iconUrl;
  // Manifest
  const m={name:"Iris – Prague Eyewear",short_name:"Iris",start_url:"/",display:"standalone",background_color:"#232323",theme_color:"#232323",icons:[{src:iconUrl,sizes:"512x512",type:"image/png"}]};
  const url=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/json"}));
  document.getElementById("pwa-manifest").href=url;
})();
</script>
