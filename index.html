const { useState, useEffect } = React;
const OG = "#2C8CD1";
const TODAY = new Date().toISOString().split("T")[0];

function haversine(la1,lo1,la2,lo2){
  const R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}
function gpsInfo(d){
  if(d===null) return{cls:"load",icon:"⏳",text:"GPS wird geladen...",ok:false};
  if(d<=25000) return{cls:"ok",  icon:"✓", text:(d<1000?d+" m":(d/1000).toFixed(1)+" km")+" — Bestätigt",ok:true};
  return            {cls:"err", icon:"✗", text:(d/1000).toFixed(1)+" km — Außerhalb (Limit 25 km)",ok:false};
}
function fmtT(iso){try{return new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}catch{return "";}}

function Badge({status}){
  const m=status==="confirmed"?"badge-ok":status==="warning"?"badge-warn":"badge-err";
  const t=status==="confirmed"?"✓ GPS":status==="warning"?"⚠ GPS":"✗ GPS";
  return <span className={"badge "+m}>{t}</span>;
}

function LoginScreen({onLogin}){

  const [remember,setRemember]=useState(false);
  const go=async()=>{
    if(busy)return;
    setBusy(true);setErr("");
    try{
      if(!window.irisAuth)throw new Error("auth-unavailable");
      await window.irisAuth.setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
      const cred=await window.irisAuth.signInWithEmailAndPassword(email.trim(),pass);
      if(!IRIS_UIDS[cred.user.uid]){await window.irisAuth.signOut();throw new Error("not-authorized");}

                          {cnt>0&&<div style={{fontSize:10,fontWeight:900,color:isSel?"white":"#c2410c"}}>{cnt}</div>}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
              <div style={{display:"flex",gap:8,marginTop:12,alignItems:"center"}}>
                <span style={{fontSize:11,color:"#9ca3af"}}>0</span>
                {["#f3f4f6","#fed7aa","#e87722"].map((c,i)=><div key={i} style={{width:14,height:14,background:c,borderRadius:3}}/>)}

              </div>
            </div>
            {selectedHistoryDay&&(
              <div>
                <div className="section-label">{new Date(selectedHistoryDay+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}</div>
                {selDS&&<div style={{fontSize:13,fontWeight:600,color:"#6b7280",display:"flex",alignItems:"center",gap:6,marginBottom:10}}>

                  <div style={{textAlign:"center",padding:"24px",color:"#9ca3af",fontSize:15}}>Keine Besuche</div>
                ):(
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {selDV.map(v=>{
                      const c=lookupCust(v.customer_id);
                      const iab={background:"none",border:"none",cursor:"pointer",fontSize:17,padding:"6px 8px",borderRadius:8,lineHeight:1};
                      return(
                        <div key={v.id} className="card" style={{display:"flex",alignItems:"center",gap:12}}>
                          <div style={{fontSize:22,width:30,textAlign:"center",flexShrink:0}}>{ri(v.result)}</div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontWeight:700,fontSize:16,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c?.name||v.customer_id}</div>
                            <div style={{fontSize:14,color:"#9ca3af"}}>{fmtT(v.confirmed_at)} · {rl(v.result)}</div><NoteLine note={v.note} size={14}/>
                          </div>
                          <button onClick={()=>{setHistEditResult(v.result);setHistEditNote(v.note||"");setHistDialog({type:"edit",visit:v});}} style={{...iab,background:"#EFF6FC"}}>✏️</button>
                          <button onClick={()=>setHistDialog({type:"delete",visit:v})} style={{...iab,background:"#FEF2F2"}}>🗑️</button>
                        </div>
                      );

                  </div>

              </div>
            )}
            {histDialog&&(
              <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setHistDialog(null)}>
                <div style={{background:"white",borderRadius:20,padding:24,maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}} onClick={e=>e.stopPropagation()}>
                  {histDialog.type==="delete"?<>
                    <div style={{textAlign:"center",fontSize:36,marginBottom:12}}>🗑️</div>
                    <div style={{fontWeight:900,fontSize:18,textAlign:"center",marginBottom:6}}>Besuch löschen?</div>
                    <div style={{fontSize:15,color:"#6b7280",textAlign:"center",marginBottom:24}}>{lookupCust(histDialog.visit.customer_id)?.name||histDialog.visit.customer_id} · {rl(histDialog.visit.result)}</div>
                    <div style={{display:"flex",gap:10}}>
                      <button onClick={()=>setHistDialog(null)} style={{flex:1,padding:"12px",borderRadius:10,background:"#f3f4f6",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Abbrechen</button>
                      <button onClick={()=>{onDeleteVisitAudit(histDialog.visit.id,histDialog.visit);setHistDialog(null);}} style={{flex:1,padding:"12px",borderRadius:10,background:"#dc2626",color:"white",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Löschen</button>
                    </div>
                  </>:<>
                    <div style={{fontWeight:900,fontSize:18,marginBottom:16}}>Besuch bearbeiten</div>
                    <div style={{fontSize:13,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}}>Ergebnis</div>
                    <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:16}}>
                      {RESULTS.map(r=>(
                        <button key={r.value} onClick={()=>setHistEditResult(r.value)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:10,border:`2px solid ${histEditResult===r.value?OG:"#e5e7eb"}`,background:histEditResult===r.value?"#EFF6FC":"white",cursor:"pointer",fontFamily:"inherit",fontWeight:histEditResult===r.value?700:500,textAlign:"left"}}>
                          <span style={{fontSize:18,width:24,textAlign:"center"}}>{r.icon}</span>
                          <span style={{fontSize:15}}>{r.label}</span>
                          {histEditResult===r.value&&<span style={{marginLeft:"auto",color:OG}}>✓</span>}
                        </button>
                      ))}
                    </div>
                    <div style={{fontSize:13,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:8}}>Notiz</div>
                    <textarea rows={2} value={histEditNote} onChange={e=>setHistEditNote(e.target.value)} placeholder="Kurze Notiz…" style={{resize:"none",marginBottom:16}}/>
                    <div style={{display:"flex",gap:10}}>
                      <button onClick={()=>setHistDialog(null)} style={{flex:1,padding:"12px",borderRadius:10,background:"#f3f4f6",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Abbrechen</button>
                      <button onClick={()=>{onEditVisitAudit(histDialog.visit.id,{result:histEditResult,note:histEditNote},histDialog.visit);setHistDialog(null);}} style={{flex:1,padding:"12px",borderRadius:10,background:OG,color:"white",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Speichern</button>
                    </div>
                  </>}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="main-panel">
      <div className="panel-header">
        <div style={{flex:1}}>
          <div className="panel-header-title">Hallo, {user.name.split(" ")[0]}</div>
          <div className="panel-header-sub">{new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
        </div>
        <button onClick={()=>{setShowHistory(true);setSelectedHistoryDay(null);}} style={{background:"#f3f4f6",border:"none",borderRadius:8,padding:"7px 13px",cursor:"pointer",fontWeight:700,fontSize:13,color:"#374151",fontFamily:"inherit"}}>📅 Verlauf</button>
      </div>
      <div className="panel-body">
        <div style={{maxWidth:580,width:"100%"}}>
        {isAD&&<>
          <button className="btn-primary" onClick={onNewVisit} style={{fontSize:17,padding:"18px 0",marginBottom:14}}>
            <span style={{fontSize:22}}>📍</span><span>KUNDENBESUCH BESTÄTIGEN</span>
          </button>
          {mine.length>0&&<>
            <div className="section-label" style={{marginTop:8}}>Kundenbesuche heute</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {[...mine].sort((a,b)=>b.confirmed_at.localeCompare(a.confirmed_at)).map(v=>{
                const c=lookupCust(v.customer_id);
                const iab={background:"none",border:"none",cursor:"pointer",fontSize:17,padding:"6px 8px",borderRadius:8,lineHeight:1};
                return (
                  <div key={v.id} className="card" style={{display:"flex",alignItems:"center",gap:12}}>
                    <div style={{fontSize:22,width:30,textAlign:"center",flexShrink:0}}>{ri(v.result)}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:4}}><button onClick={()=>onCustDetail&&onCustDetail(c)} style={{background:"none",border:"none",padding:0,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:16,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"inherit",textDecoration:"none",textAlign:"left"}}>{c?.name||v.customer_id}</button>{c&&custBadge(c.id)}</div>
                      <div style={{fontSize:14,color:"#9ca3af"}}>{fmtT(v.confirmed_at)} · {rl(v.result)}</div><NoteLine note={v.note} size={14}/>
                    </div>
                    <Badge status={v.status}/>
                    <button onClick={()=>{setEditResult(v.result);setEditNote(v.note||"");setEditCustName("");setEditCustCity("");setDialog({type:"edit",visit:v});}} style={{...iab,background:"#EFF6FC"}}>✏️</button>
                    <button onClick={()=>setDialog({type:"delete",visit:v})} style={{...iab,background:"#FEF2F2"}}>🗑️</button>
                  </div>
                );
              })}
            </div>
          </>}
          {dialog&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setDialog(null)}>
              <div style={{background:"white",borderRadius:20,padding:24,maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}} onClick={e=>e.stopPropagation()}>
                {dialog.type==="delete"?<>
                  <div style={{textAlign:"center",fontSize:36,marginBottom:12}}>🗑️</div>
                  <div style={{fontWeight:900,fontSize:18,textAlign:"center",marginBottom:6}}>Besuch löschen?</div>
                  <div style={{fontSize:15,color:"#6b7280",textAlign:"center",marginBottom:24}}>{lookupCust(dialog.visit.customer_id)?.name||dialog.visit.customer_id} · {rl(dialog.visit.result)}</div>
                  <div style={{display:"flex",gap:10}}>
                    <button onClick={()=>setDialog(null)} style={{flex:1,padding:"12px",borderRadius:10,background:"#f3f4f6",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Abbrechen</button>
                    <button onClick={()=>{onDeleteVisitAudit(dialog.visit.id,dialog.visit);setDialog(null);}} style={{flex:1,padding:"12px",borderRadius:10,background:"#dc2626",color:"white",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Löschen</button>
                  </div>
                </>:<>
                  <div style={{fontWeight:900,fontSize:18,marginBottom:16}}>Besuch bearbeiten</div>
                  {String(dialog.visit.customer_id).startsWith('new_')&&(()=>{
                    const nc=lookupCust(dialog.visit.customer_id);
                    return(<div style={{marginBottom:16}}>
                      <div style={{fontSize:13,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:8}}>Kundenname</div>
                      <input value={editCustName} onChange={e=>setEditCustName(e.target.value)} placeholder={nc?.name||"Firmenname"} style={{marginBottom:8}}/>
                      <input value={editCustCity} onChange={e=>setEditCustCity(e.target.value)} placeholder={nc?.city||"Stadt"} style={{marginBottom:0}}/>
                    </div>);
                  })()}
                  <div style={{fontSize:13,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}}>Ergebnis</div>
                  <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:16}}>
                    {RESULTS.map(r=>(
                      <button key={r.value} onClick={()=>setEditResult(r.value)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:10,border:`2px solid ${editResult===r.value?OG:"#e5e7eb"}`,background:editResult===r.value?"#EFF6FC":"white",cursor:"pointer",fontFamily:"inherit",fontWeight:editResult===r.value?700:500,textAlign:"left"}}>
                        <span style={{fontSize:18,width:24,textAlign:"center"}}>{r.icon}</span>
                        <span style={{fontSize:15}}>{r.label}</span>
                        {editResult===r.value&&<span style={{marginLeft:"auto",color:OG}}>✓</span>}
                      </button>
                    ))}
                  </div>
                  <div style={{fontSize:13,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:8}}>Notiz</div>
                  <textarea rows={2} value={editNote} onChange={e=>setEditNote(e.target.value)} placeholder="Kurze Notiz…" style={{resize:"none",marginBottom:16}}/>
                  <div style={{display:"flex",gap:10}}>
                    <button onClick={()=>setDialog(null)} style={{flex:1,padding:"12px",borderRadius:10,background:"#f3f4f6",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Abbrechen</button>
                    <button onClick={()=>{
                      onEditVisit(dialog.visit.id,{result:editResult,note:editNote});
                      if(String(dialog.visit.customer_id).startsWith('new_')){
                        const changes={};
                        if(editCustName.trim())changes.name=editCustName.trim();
                        if(editCustCity.trim())changes.city=editCustCity.trim();
                        if(Object.keys(changes).length)onEditNewCust(dialog.visit.customer_id,changes);
                      }
                      setDialog(null);
                    }} style={{flex:1,padding:"12px",borderRadius:10,background:OG,color:"white",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Speichern</button>
                  </div>
                </>}
              </div>
            </div>
          )}
          {mine.length===0&&<div style={{textAlign:"center",padding:"48px 0",color:"#d1d5db"}}><div style={{fontSize:48,marginBottom:12}}>🗺</div><div style={{fontSize:16}}>Keine Besuche heute</div></div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:14,marginTop:24}}>
            {[{l:"Besuche heute",v:mine.length,c:OG},{l:"Bestellungen",v:orders.length,c:"#16a34a"}].map(s=>(
              <div key={s.l} className="stat-box">
                <div className="stat-num" style={{color:s.c}}>{s.v}</div>
                <div className="stat-lbl">{s.l}</div>
              </div>
            ))}
          </div>
        </>}
        {workday&&!isAD&&(
          <div style={{textAlign:"center",padding:"60px 0"}}>
            <div style={{fontSize:64,marginBottom:16}}>{ds?.icon}</div>
            <div style={{fontSize:24,fontWeight:900,color:"#111827"}}>{ds?.label}</div>
            {ds?.note&&<div style={{fontSize:14,color:"#9ca3af",marginTop:4}}>{ds.note}</div>}
            {workday.day_status==="messe"&&workday.event_name&&<div style={{fontSize:18,fontWeight:700,color:"#374151",marginTop:12}}>{workday.event_name}{workday.event_city?" · "+workday.event_city:""}</div>}
            {workday.note&&<div style={{fontSize:16,color:"#9ca3af",marginTop:8,fontStyle:"italic"}}>{workday.note}</div>}
          </div>
        )}
        {!workday&&<div style={{textAlign:"center",padding:"60px 0",color:"#d1d5db"}}><div style={{fontSize:48,marginBottom:12}}>📋</div><div style={{fontSize:16}}>Tippe oben auf TAG EINRICHTEN um zu starten</div></div>}
        </div>
      </div>
    </div>
  );
}

/* ── DAY SETUP ── */
function DaySetupScreen({user,existing,onBack,onSave}){
  const [step,setStep]=useState("type");
  const [dayStatus,setDayStatus]=useState(existing?.day_status||"");
  const [startLoc,setStartLoc]=useState(existing?.start_location||"");
  const [overnight,setOvernight]=useState(existing?.overnight||"");
  const [eventName,setEventName]=useState(existing?.event_name||"");
  const [eventCity,setEventCity]=useState(existing?.event_city||"");
  const [note,setNote]=useState(existing?.note||"");

  const commit=(status,sl,on,en,ec,nt)=>onSave({user_id:user.id,date:TODAY,day_status:status,start_location:sl,overnight:on,event_name:en,event_city:ec,note:nt});
  const pickType=val=>{
    setDayStatus(val);
    const noExtra=["homeoffice","buro","schulung","inventur","sonstige"];
    const abs=["urlaub","krankheit","feiertag","fza","sonderurlaub","unbezahlt"];
    if(val==="aussendienst") setStep("start");
    else if(val==="messe")   setStep("messe");
    else if(noExtra.includes(val)) setStep("note");
    else if(abs.includes(val))     setStep("abs_confirm");
  };

  const content=()=>{
    if(step==="type") return (
      <div style={{maxWidth:520,width:"100%"}}>
        {DAY_STATUS_GROUPS.map(g=>(
          <div key={g.group} style={{marginBottom:12}}>
            <div className="group-label">{g.group}</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {g.items.map(item=>(
                <button key={item.value} className={"result-btn"+(dayStatus===item.value?" active":"")} onClick={()=>pickType(item.value)}>
                  <span style={{fontSize:20,width:28,textAlign:"center",flexShrink:0}}>{item.icon}</span>
                  <div style={{flex:1}}>
                    <div className="result-lbl">{item.label}</div>
                    {item.note&&<div className="result-sub">{item.note}</div>}
                  </div>
                  {dayStatus===item.value&&<span className="result-check">✓</span>}
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
    );
    if(step==="start") return (
      <div style={{maxWidth:480,width:"100%"}}>
        <div className="card" style={{background:"#EFF6FC",border:"1px solid #BFDFEF",marginBottom:16}}>
          <div style={{fontSize:15,color:"#1A5F8A",fontWeight:700}}>🚗 Kundentour — wo startest du heute?</div>
        </div>
        <div className="section-label">Startort *</div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {LOCATION_TYPES.map(loc=>(
            <button key={loc.value} className={"result-btn"+(startLoc===loc.value?" active":"")} onClick={()=>setStartLoc(loc.value)}>
              <span style={{fontSize:22,width:28,textAlign:"center"}}>{loc.icon}</span>
              <span className="result-lbl">{loc.label}</span>
              {startLoc===loc.value&&<span className="result-check">✓</span>}
            </button>
          ))}
        </div>
        <button className="btn-primary" disabled={!startLoc} onClick={()=>commit("aussendienst",startLoc,"","","","")} style={{marginBottom:10}}>✓ BESTÄTIGEN</button>
        <button onClick={()=>setStep("type")} style={{width:"100%",background:"none",border:"1.5px solid #e5e7eb",borderRadius:13,padding:"13px 0",fontWeight:700,fontSize:16,color:"#374151",cursor:"pointer",fontFamily:"inherit"}}>← Zurück zur Auswahl</button>
      </div>
    );
    if(step==="messe") return (
      <div style={{maxWidth:480,width:"100%"}}>
        <div className="card" style={{background:"#f5f0ff",border:"1px solid #c4b5fd",marginBottom:16}}>
          <div style={{fontSize:15,color:"#7c3aed",fontWeight:700}}>🎪 Veletrh / výstava — zadejte údaje</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:14,marginBottom:16}}>
          <div>
            <div className="section-label">Veranstaltungsname *</div>
            <input placeholder="z. B. OPTI München" value={eventName} onChange={e=>setEventName(e.target.value)}/>
          </div>
          <div>
            <div className="section-label">Stadt</div>
            <input placeholder="z. B. München" value={eventCity} onChange={e=>setEventCity(e.target.value)}/>
          </div>
          <div>
            <div className="section-label">Übernachtungsort</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {OVERNIGHT_TYPES.map(loc=>(
                <button key={loc.value} className={"result-btn"+(overnight===loc.value?" active":"")} onClick={()=>setOvernight(loc.value)}>
                  <span style={{fontSize:20,width:28,textAlign:"center"}}>{loc.icon}</span>
                  <span className="result-lbl">{loc.label}</span>
                  {overnight===loc.value&&<span className="result-check">✓</span>}
                </button>
              ))}
            </div>
          </div>
        </div>
        <button className="btn-primary" disabled={!eventName} onClick={()=>commit("messe","",overnight,eventName,eventCity,"")} style={{marginBottom:10}}>✓ BESTÄTIGEN</button>
        <button onClick={()=>setStep("type")} style={{width:"100%",background:"none",border:"1.5px solid #e5e7eb",borderRadius:13,padding:"13px 0",fontWeight:700,fontSize:16,color:"#374151",cursor:"pointer",fontFamily:"inherit"}}>← Zurück zur Auswahl</button>
      </div>
    );
    if(step==="note"){
      const ds=dsInfo(dayStatus);
      return (
        <div style={{maxWidth:480,width:"100%"}}>
          <div className="card" style={{background:"#f0fdf4",border:"1px solid #86efac",marginBottom:16}}>
            <div style={{fontSize:15,color:"#15803d",fontWeight:700}}>{ds?.icon} {ds?.label}{ds?.note?" — "+ds.note:""}</div>
          </div>
          <div style={{marginBottom:16}}>
            <div className="section-label">Notiz (optional)</div>
            <textarea rows={3} placeholder="Weitere Informationen…" value={note} onChange={e=>setNote(e.target.value)} style={{resize:"none"}}/>
          </div>
          <button className="btn-primary" onClick={()=>commit(dayStatus,"","","","",note)} style={{marginBottom:10}}>✓ BESTÄTIGEN</button>
          <button onClick={()=>setStep("type")} style={{width:"100%",background:"none",border:"1.5px solid #e5e7eb",borderRadius:13,padding:"13px 0",fontWeight:700,fontSize:16,color:"#374151",cursor:"pointer",fontFamily:"inherit"}}>← Zurück zur Auswahl</button>
        </div>
      );
    }
    if(step==="abs_confirm"){
      const ds=dsInfo(dayStatus);
      return (
        <div style={{maxWidth:480,width:"100%"}}>
          <div className="card" style={{textAlign:"center",padding:40,marginBottom:16}}>
            <div style={{fontSize:56,marginBottom:12}}>{ds?.icon}</div>
            <div style={{fontSize:24,fontWeight:900,color:"#111827"}}>{ds?.label}</div>
            {ds?.note&&<div style={{fontSize:14,color:"#9ca3af",marginTop:4}}>{ds.note}</div>}
          </div>
          <button className="btn-primary" onClick={()=>commit(dayStatus,"","","","","")} style={{marginBottom:10}}>✓ BESTÄTIGEN</button>
          <button onClick={()=>setStep("type")} style={{width:"100%",background:"none",border:"1.5px solid #e5e7eb",borderRadius:13,padding:"13px 0",fontWeight:700,fontSize:16,color:"#374151",cursor:"pointer",fontFamily:"inherit"}}>← Zurück zur Auswahl</button>
        </div>
      );
    }
    return null;
  };

  return (
    <div className="main-panel">
      <div className="panel-header">
        <button className="back-btn" onClick={step==="type"?onBack:()=>setStep("type")}>‹</button>
        <div>
          <div className="panel-header-title">Tagesplanung</div>
          <div className="panel-header-sub">{new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}</div>
        </div>
      </div>
      <div className="panel-body">{content()}</div>
    </div>
  );
}

/* ── OVERNIGHT ── */
function OvernightScreen({workday,onBack,onSave}){
  const [overnight,setOvernight]=useState(workday?.overnight||"");
  return (
    <div className="main-panel">
      <div className="panel-header">
        <button className="back-btn" onClick={onBack}>‹</button>
        <div className="panel-header-title">Wo übernachtest du?</div>
      </div>

function VisitConfirmScreen({user,customer,onBack,onConfirm}){
  const [pos,setPos]=useState(null); const [gpsErr,setGpsErr]=useState(null); const [gpsErrCode,setGpsErrCode]=useState(null); const [loading,setLoading]=useState(true);
  const [cityPos,setCityPos]=useState(null); const [cityLoading,setCityLoading]=useState(customer.isNew);
  const [result,setResult]=useState(""); const [units,setUnits]=useState(""); const [note,setNote]=useState("");
  const [saving,setSaving]=useState(false); const [done,setDone]=useState(false);
  useEffect(()=>{
    if(!navigator.geolocation){setGpsErr("GPS nicht verfügbar");setLoading(false);return;}
    navigator.geolocation.getCurrentPosition(
      p=>{setPos({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)});setLoading(false);},
      e=>{setGpsErrCode(e?.code||0);setGpsErr("GPS nicht verfügbar");setLoading(false);},
      {enableHighAccuracy:true,timeout:12000}
    );
  },[]);
  useEffect(()=>{
    if(!customer.isNew||!customer.city)return;
    fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(customer.city)}&format=json&limit=1&countrycodes=de,at,ch`)
      .then(r=>r.json())
      .then(d=>{if(d&&d[0])setCityPos({lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)});setCityLoading(false);})
      .catch(()=>setCityLoading(false));
  },[]);
  const dist=customer.isNew
    ?(pos&&cityPos?haversine(pos.lat,pos.lng,cityPos.lat,cityPos.lng):null)
    :(pos&&customer.lat!=null&&customer.lng!=null?haversine(pos.lat,pos.lng,customer.lat,customer.lng):null);
  const noGps=!customer.isNew&&customer.lat==null;
  const gi=customer.isNew
    ?(cityLoading
      ?{cls:"load",icon:"⏳",text:"Stadtposition wird ermittelt…",ok:true}
      :!cityPos
        ?{cls:"load",icon:"📍",text:"Stadt nicht gefunden – Besuch wird erfasst",ok:true}
        :dist===null
          ?{cls:"load",icon:"📍",text:"GPS wird ermittelt…",ok:true}
          :dist<=25000
            ?{cls:"ok",icon:"✅",text:`Neukunde · ${dist<1000?dist+" m":(dist/1000).toFixed(1)+" km"} von ${customer.city}`,ok:true}
            :{cls:"err",icon:"✗",text:`Zu weit: ${(dist/1000).toFixed(1)} km von ${customer.city} (Limit 25 km)`,ok:false})
    :customer.lat==null
      ?{cls:"load",icon:"📍",text:"Kundenstandort nicht hinterlegt – Besuch wird erfasst",ok:true}
      :gpsInfo(loading?null:dist);
  const vs=customer.isNew
    ?(dist===null?"unknown":dist<=25000?"confirmed":"rejected")
    :(noGps?(pos?"confirmed":"unknown"):dist===null?"unknown":dist<=25000?"confirmed":"rejected");
  const go=()=>{
    if(!result||saving)return; setSaving(true);
    setTimeout(async()=>{try{const ok=await onConfirm({id:Date.now(),rep_id:user.id,customer_id:customer.id,confirmed_at:new Date().toISOString(),distance:dist,status:vs,result,units:result==="order"?(parseInt(units)||0):0,note,gps_err:gpsErrCode,_cityPos:customer.isNew?cityPos:null});if(ok!==false)setDone(true);}finally{setSaving(false);}},900);
  };
  if(done) return (
    <div className="main-panel" style={{alignItems:"center",justifyContent:"center",textAlign:"center"}}>
      <div style={{padding:40}}>
        <div style={{fontSize:72,marginBottom:16}}>✅</div>
        <div style={{fontSize:28,fontWeight:900,color:"#111827",marginBottom:4}}>Gespeichert!</div>
        <div style={{fontSize:16,color:"#6b7280"}}>{customer.name}</div>
        {dist!==null&&!customer.isNew&&<div style={{fontSize:14,color:"#9ca3af",marginTop:4}}>GPS-Entfernung: {dist} m</div>}
      </div>
    </div>
  );
  return (
    <div className="main-panel">
      <div className="panel-header">
        <button className="back-btn" onClick={onBack}>‹</button>
        <div>
          <div className="panel-header-title">Besuch bestätigen</div>
          <div className="panel-header-sub">{customer.name}{customer.city?` · ${customer.city}`:""}</div>
        </div>
      </div>
      <div className="panel-body">
        <div style={{maxWidth:520,width:"100%",display:"flex",flexDirection:"column",gap:14}}>
          <div className={"gps-box "+gi.cls}>
            <div className="gps-text"><span style={{fontSize:18}}>{gi.icon}</span><span>{(!noGps&&gpsErr)||gi.text}</span></div>
            {pos&&<div style={{fontSize:14,color:"#6b7280",marginTop:4}}>GPS-Genauigkeit: ±{pos.acc} m</div>}
            {!customer.isNew&&dist!==null&&dist>300&&<div style={{fontSize:14,color:"#b91c1c",marginTop:6,fontWeight:600}}>Sie sind zu weit entfernt. Der Besuch wird zur Überprüfung markiert.</div>}
          </div>
          <div>
            <div className="section-label">Besuchsergebnis *</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {RESULTS.map(r=>(
                <button key={r.value} className={"result-btn"+(result===r.value?" active":"")} onClick={()=>setResult(r.value)}>
                  <span style={{fontSize:18,width:24,textAlign:"center"}}>{r.icon}</span>
                  <span className="result-lbl">{r.label}</span>
                  {result===r.value&&<span className="result-check">✓</span>}
                </button>
              ))}
            </div>
          </div>
          <div>
            <div className="section-label">Notiz (optional)</div>
            <textarea rows={2} placeholder="Kurze Notiz…" value={note} onChange={e=>setNote(e.target.value)} style={{resize:"none"}}/>
          </div>
          <button className="btn-primary" onClick={go} disabled={!result||saving}
            style={{background:(!result||saving)?"#e5e7eb":OG,color:(!result||saving)?"#9ca3af":"white",cursor:(!result||saving)?"not-allowed":"pointer"}}>
            {saving?"⏳ Wird gespeichert…":"KUNDENBESUCH BESTÄTIGEN"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── DASHBOARD ── */
function RepMap({visits,custs}){
  const divRef=React.useRef(null);
  const mapRef=React.useRef(null);
  const markersRef=React.useRef([]);
  React.useEffect(()=>{
    if(!divRef.current||typeof L==='undefined') return;
    if(!mapRef.current){
      mapRef.current=L.map(divRef.current).setView([51.0,10.5],5);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19}).addTo(mapRef.current);
    }
    markersRef.current.forEach(m=>m.remove());
    markersRef.current=[];
    const bounds=[];
    visits.forEach(v=>{
      const c=custs.find(x=>String(x.id)===String(v.customer_id));
      if(!c?.lat||!c?.lng) return;
      const ok=v.status!=='rejected';
      const color=ok?'#16a34a':'#dc2626';
      const rep=USERS.find(u=>u.id===v.rep_id);
      const popup=`<b>${escHtml(String(c.name||""))}</b><br><span style="color:#6b7280">${escHtml(String(rep?.name||''))}</span><br>${new Date(v.confirmed_at).toLocaleDateString('de-DE')} ${fmtT(v.confirmed_at)}<br>${escHtml(String(rl(v.result)||""))}${v.distance!=null&&v.distance>=0&&v.distance!==9999?'<br>📍 '+escHtml(String(v.distance))+' m':''}${v.note?'<br><i style="color:#374151">📝 „'+escHtml(v.note)+'"</i>':''}`;
      const m=L.circleMarker([c.lat,c.lng],{radius:8,color,fillColor:color,fillOpacity:0.85,weight:2}).bindPopup(popup);
      m.addTo(mapRef.current);
      markersRef.current.push(m);
      bounds.push([c.lat,c.lng]);
    });
    if(bounds.length>0) mapRef.current.fitBounds(bounds,{padding:[30,30]});
    else mapRef.current.setView([51.0,10.5],5);
  },[visits,custs]);
  React.useEffect(()=>()=>{if(mapRef.current){mapRef.current.remove();mapRef.current=null;}},[]);
  const withGps=visits.filter(v=>{const c=custs.find(x=>String(x.id)===String(v.customer_id));return c?.lat&&c?.lng;}).length;
  return(
    <div style={{marginTop:12}}>
      <div style={{fontSize:12,color:"#9ca3af",marginBottom:6,display:"flex",gap:16,alignItems:"center"}}>
        <span><span style={{display:"inline-block",width:10,height:10,borderRadius:"50%",background:"#16a34a",marginRight:4}}/>GPS - OK</span>
        <span><span style={{display:"inline-block",width:10,height:10,borderRadius:"50%",background:"#dc2626",marginRight:4}}/>GPS - NICHT OK</span>
        <span style={{marginLeft:"auto"}}>{withGps} / {visits.length} mit GPS</span>
      </div>
      <div ref={divRef} style={{height:400,borderRadius:12,overflow:"hidden",border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}/>
    </div>
  );
}

  const adjMonth=n=>{const [y,m]=repMonth.split("-").map(Number);const d=new Date(y,m-1+n,1);setRepMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);};
  const monthLabel=()=>{const [y,m]=repMonth.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});};
  const getMonthDays=()=>{const [y,m]=repMonth.split("-").map(Number);const dim=new Date(y,m,0).getDate();return Array.from({length:dim},(_,i)=>{const d=i+1;const dateStr=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;const wds=workdays.filter(w=>w.date===dateStr);const dayVisits=visits.filter(v=>v.confirmed_at.startsWith(dateStr));return {dateStr,d,dow:new Date(y,m-1,d).getDay(),wds,dayVisits};});};
  // Helper: get last N days as date strings
  const getLast7Days=()=>{const now=new Date();const nowDow=now.getDay();const mondayDiff=now.getDate()-nowDow+(nowDow===0?-6:1);const monday=new Date(now);monday.setDate(mondayDiff);return Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);const ds=d.toISOString().slice(0,10);const dow=d.getDay();const isToday=ds===TODAY;return{dateStr:ds,d:d.getDate(),dow,isToday,dayVisits:visits.filter(v=>v.confirmed_at.startsWith(ds))};});};
  const fmtConv=(v,o)=>v===0?"—":`${Math.round(o/v*100)}%`;

  // Unified nav buttons — always shown in every panel-header
  const btnSt=(active)=>({background:active?OG:"#f3f4f6",border:"none",borderRadius:8,padding:"7px 10px",cursor:"pointer",fontWeight:700,fontSize:12,color:active?"white":"#374151",fontFamily:"inherit",flex:"1 1 calc(50% - 3px)",minWidth:0,textAlign:"center"});

      <button className="panel-nav-btn" data-active={view==="week"&&!selRep} style={btnSt(view==="week"&&!selRep)} onClick={()=>{setSelRep(null);setView("week");setShowMap(false);}}>📅 Woche</button>

              const daysFromMon=dow===0?6:dow-1;
              const daysCount=daysFromMon+1;
              const weekVisits=(repId,offsetWeeks)=>{
                let total=0;
                const base=new Date(now);
                base.setDate(now.getDate()-daysFromMon-offsetWeeks*7);
                for(let i=0;i<daysCount;i++){
                  const d=new Date(base);d.setDate(base.getDate()+i);
                  total+=visits.filter(v=>v.rep_id===repId&&v.confirmed_at.startsWith(d.toISOString().slice(0,10))).length;
                }
                return total;
              };
              const repStats=reps.map(r=>({
                ...r,
                totalV:mdays.reduce((s,day)=>s+day.dayVisits.filter(v=>v.rep_id===r.id).length,0),
                totalO:mdays.reduce((s,day)=>s+day.dayVisits.filter(v=>v.rep_id===r.id&&v.result==="order").length,0),
                thisW:weekVisits(r.id,0),
                lastW:weekVisits(r.id,1),
              }));
              const maxV=Math.max(1,...repStats.map(r=>r.totalV));
              return (
                <div style={{background:"white",borderRadius:14,border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",padding:"16px 20px",marginTop:12,marginBottom:4}}>

                    const diff=r.lastW===0?(r.thisW>0?100:0):Math.round((r.thisW-r.lastW)/r.lastW*100);

                    return (
                      <div key={r.id} style={{marginBottom:ri<repStats.length-1?16:0}}>

                            <div style={{height:"100%",width:conv+"%",background:"#16a34a",borderRadius:3}}/>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>
        </div>
      </div>
    );
  }

  // Helper: export all visits to CSV
  const exportVisitsCSV=()=>{
    const hdr=["Datum","Uhrzeit","Vertreter","Kunde","PLZ","Ort","Ergebnis","GPS-Status","Distanz (m)","Notiz"];
    const rows=[...visits].sort((a,b)=>b.confirmed_at.localeCompare(a.confirmed_at)).map(v=>{
      const rep=USERS.find(u=>u.id===v.rep_id);
      const c=allCusts.find(cu=>String(cu.id)===String(v.customer_id));
      const dt=new Date(v.confirmed_at);
      return [
        dt.toLocaleDateString("de-DE"),
        dt.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
        rep?.name||v.rep_id,
        c?.name||v.customer_id,
        c?.postal||"",
        c?.city||"",
        rl(v.result),
        v.status,
        (v.distance!=null&&v.distance!==9999)?v.distance:"",
        v.note||"",
      ].map(s=>`"${String(s).replace(/^[\s]*[=+@\-]/,m=>"'"+m).replace(/"/g,'""')}"`).join(",");
    });
    const csv=[hdr.join(","),...rows].join("\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`iris_besuche_${TODAY}.csv`;a.click();

          <div className="panel-header-sub">{new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
        </div>
        {navBtns}
      </div>
      <div className="panel-body">
        <div style={{maxWidth:680,width:"100%"}}>
        <div className="stats-grid-4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:28}}>
          {[{l:"Besuche",v:tot.v,c:OG},{l:"Bestellungen",v:tot.o,c:"#16a34a"},{l:"Konversionsrate",v:tot.conv,c:"#6366f1"},{l:"Zur Überprüfung",v:tot.f,c:"#dc2626"}].map(s=>(
            <div key={s.l} className="stat-box"><div className="stat-num" style={{color:s.c,fontSize:typeof s.v==="string"?22:28}}>{s.v}</div><div className="stat-lbl">{s.l}</div></div>
          ))}
        </div>
{showMap&&<>
  <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
    {[{id:null,label:"Alle"},...reps.map(r=>({id:r.id,label:r.name.split(" ").map(n=>n[0]).join("")+" "+r.name.split(" ")[0]}))].map(({id,label})=>{
      const active=mapRepFilter===id;
      return <button key={String(id)} onClick={()=>setMapRepFilter(id)} style={{background:active?OG:"#f3f4f6",color:active?"white":"#374151",border:"none",borderRadius:20,padding:"5px 13px",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>{label}</button>;
    })}
  </div>
  <RepMap visits={mapRepFilter?tod.filter(v=>v.rep_id===mapRepFilter):tod} custs={allCusts}/>
</>}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:0}}>
          <div className="section-label" style={{marginBottom:6}}>Rangliste — {todayLabel}</div>
          <button onClick={exportVisitsCSV} style={{fontSize:12,fontWeight:700,color:"#374151",background:"#f3f4f6",border:"none",borderRadius:8,padding:"5px 11px",cursor:"pointer",fontFamily:"inherit",marginBottom:6}}>⬇ CSV</button>
        </div>
        <div className="team-ranklist-card" style={{borderRadius:14,overflow:"hidden",border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",marginBottom:24}}>
          <div className="team-today-hd" style={{display:"grid",gridTemplateColumns:"1fr 70px 70px 80px",padding:"10px 16px",background:"#f9fafb",borderBottom:"1px solid #f0f0f0"}}>
            {["Vertreter","Bes.","Best.","Konv."].map(h=>(
              <div key={h} style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:".08em",textAlign:["Bes.","Best.","Konv."].includes(h)?"center":"left"}}>{h}</div>
            ))}
          </div>
          {rankList.map((r,i)=>(
            <button key={r.id} onClick={()=>setSelRep(r)}
              className="team-today-row" style={{display:"grid",gridTemplateColumns:"1fr 70px 70px 80px",width:"100%",padding:"13px 16px",background:"white",border:"none",borderBottom:i<rankList.length-1?"1px solid #f9fafb":"none",cursor:"pointer",textAlign:"left",fontFamily:"inherit",transition:"background .1s",alignItems:"center"}}
              onMouseOver={e=>e.currentTarget.style.background="#f9fafb"} onMouseOut={e=>e.currentTarget.style.background="white"}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:30,height:30,borderRadius:"50%",background:OG,color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,flexShrink:0}}>{r.initials}</div>
                <div style={{fontSize:14,fontWeight:700}}>{r.name}</div>
              </div>
              <div style={{textAlign:"center",fontSize:16,fontWeight:900,color:r.moVisits>0?OG:"#d1d5db"}}>{r.moVisits||"—"}</div>
              <div style={{textAlign:"center",fontSize:16,fontWeight:900,color:r.moOrders>0?"#16a34a":"#d1d5db"}}>{r.moOrders||"—"}</div>
              <div style={{textAlign:"center",fontSize:14,fontWeight:700,color:"#6b7280"}}>{r.moConv!==null?r.moConv+"%":"—"}</div>
            </button>
          ))}
        </div>
        {tot.f>0&&<>
          <div className="section-label" style={{color:"#f87171"}}>⚠ Zur Überprüfung ({tot.f})</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {tod.filter(v=>v.status==="rejected").map(v=>{
              const c=lookupCust(v.customer_id);

        </>}
        {auditLogs.length>0&&<>
          <div style={{display:"flex",alignItems:"center",marginTop:24,marginBottom:0}}>

            {clearAuditLog&&<button onClick={()=>{if(window.confirm("Alle Änderungseinträge löschen?"))clearAuditLog();}} style={{fontSize:12,color:"#dc2626",background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontWeight:600}}>🗑 Alle löschen</button>}

              const rep=USERS.find(u=>u.email===log.repEmail);
              const c=log.before?lookupCust(log.before.customer_id):null;
              const ts=log.timestamp?new Date(log.timestamp).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"-";

                <div key={log.id||i} style={{padding:"11px 16px",borderBottom:i<auditLogs.length-1?"1px solid #f9fafb":"none"}}>

                    <span style={{fontSize:14,fontWeight:700,color:log.action==="deleted"?"#dc2626":"#e87722"}}>{log.action==="deleted"?"🗑️ gelöscht":"✏️ bearbeitet"}</span>
                    <span style={{fontSize:13,color:"#374151",fontWeight:600}}>{rep?.name||log.repEmail}</span>
                    <span style={{marginLeft:"auto",fontSize:12,color:"#9ca3af",flexShrink:0}}>{ts}</span>
                  </div>
                  <div style={{fontSize:13,color:"#6b7280"}}>
                    {c?.name||log.before?.customer_id||"?"}
                    {log.before?` · ${rl(log.before.result)}`:""}
                    {log.action==="edited"&&log.after&&log.before?.result!==log.after?.result?<span style={{color:"#374151",fontWeight:700}}> → {rl(log.after.result)}</span>:""}
                  </div>
                </div>
              );
            })}
          </div>
        </>}
        </div>
      </div>
    </div>
  );
}

/* ── CUSTOMER DETAIL ── */
function CustomerDetailScreen({user,customer,visits,onBack}){
  // Plná historie: App drží jen posledních 90 dní, proto se z Firestore dotáhne vše pro tohoto zákazníka
  const [fullV,setFullV]=useState(null);
  useEffect(()=>{
    const DB=window.db;
    if(!window.USE_FIREBASE||!DB) return;
    let alive=true;
    (user.role==="manager"?DB.collection('visits'):DB.collection('visits').where('rep_id','==',user.id)).where('customer_id','==',customer.id).get()
      .then(snap=>{if(alive)setFullV(snap.docs.map(d=>safeVisit(d.data(),d.id)));})
      .catch(e=>console.error("[Iris] customer history:",e));
    return ()=>{alive=false;};
  },[customer.id,user.uid]);
  const src=fullV||visits;
  const allV=[...src].filter(v=>String(v.customer_id)===String(customer.id)).sort((a,b)=>b.confirmed_at.localeCompare(a.confirmed_at));
  const myV=allV.filter(v=>v.rep_id===user.id);
  const orders=allV.filter(v=>v.result==="order").length;
  const daysSince=allV[0]?Math.floor((Date.now()-new Date(allV[0].confirmed_at))/86400000):null;
  // Poslední objednávka = novější z importu (customer.lastOrder) a z návštěv s objednávkou zadaných v aplikaci
  const lastOrderVisit=allV.find(v=>v.result==="order"&&v.confirmed_at);
  const lastOrderApp=lastOrderVisit?new Date(lastOrderVisit.confirmed_at).toLocaleDateString("sv-SE"):null; // YYYY-MM-DD v místním čase
  const lastOrderImp=customer.lastOrder?String(customer.lastOrder).slice(0,10):null;
  const lastOrder=[lastOrderImp,lastOrderApp].filter(Boolean).sort().pop()||null;
  const lastOrderDays=lastOrder?Math.max(0,Math.floor((Date.now()-new Date(lastOrder+"T12:00:00"))/86400000)):null;
  const st=custStatus(customer.id);
  const repName=id=>USERS.find(u=>u.id===id)?.name||"—";
  return (
    <div className="main-panel">
      <div className="panel-header">
        <button className="back-btn" onClick={onBack}>‹</button>
        <div style={{flex:1}}>
          <div className="panel-header-title" style={{fontSize:18,lineHeight:1.2}}>{customer.name}</div>
          <div className="panel-header-sub">{customer.postal} {customer.city}</div>
        </div>
      </div>
      <div className="panel-body">
        <div style={{maxWidth:600,width:"100%"}}>
          {st&&<div className={st.type==="gesperrt"?"gesp-banner":""} style={{marginBottom:16,padding:"12px 16px",borderRadius:12,border:"2.5px solid "+(st.type==="gesperrt"?"#000":"#dc2626"),background:st.type==="gesperrt"?"#111":"#fef2f2",color:st.type==="gesperrt"?"#fff":"#991b1b",fontWeight:700,fontSize:15}}>
            {st.type==="gesperrt"
              ?<>⛔ GESPERRT — bitte nicht besuchen</>
              :<>🏷 Einkaufsgemeinschaft: {st.label} <span style={{fontWeight:500,fontSize:13}}>· höhere Rabatte</span></>}
          </div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:16}}>
            {[
              {l:"Besuche gesamt",v:allV.length,c:OG},
              {l:"Bestellungen",v:orders,c:"#16a34a"},
              {l:"Tage seit letztem",v:daysSince!==null?daysSince:"—",c:"#374151"},
            ].map(s=><div key={s.l} className="stat-box"><div className="stat-num" style={{color:s.c}}>{s.v}</div><div className="stat-lbl">{s.l}</div></div>)}
          </div>
          {customer.street&&<div className="card" style={{marginBottom:12,fontSize:14,color:"#374151"}}>📍 {customer.street}, {customer.postal} {customer.city}</div>}
          {(customer.nr||lastOrder)&&<div className="card" style={{marginBottom:12,fontSize:14,color:"#374151",display:"flex",gap:16,flexWrap:"wrap"}}>
            {customer.nr&&<span>🔢 Kd-Nr. <b>{customer.nr}</b></span>}
            {lastOrder&&<span>🛒 Letzte Bestellung: <b>{new Date(lastOrder+"T12:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})}</b> <span style={{color:"#9ca3af"}}>({lastOrderDays} Tage)</span></span>}
          </div>}
          <a href={appleMapsUrl(customer)} target="_blank" rel="noopener" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,width:"100%",boxSizing:"border-box",padding:"15px 18px",borderRadius:13,background:OG,color:"#fff",fontWeight:800,fontSize:16,textDecoration:"none",marginBottom:8}}>🧭 Route in Apple Karten</a>
          <a href={mapsUrl(customer)} target="_blank" rel="noopener" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,width:"100%",boxSizing:"border-box",padding:"11px 18px",borderRadius:13,background:"transparent",color:OG,border:"1.5px solid "+OG,fontWeight:700,fontSize:14,textDecoration:"none",marginBottom:20}}>Route in Google Maps</a>

            :<div style={{background:"white",borderRadius:14,overflow:"hidden",border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
              {allV.map((v,i)=>(
                <div key={v.id} className="det-row" style={{borderBottom:i<allV.length-1?"1px solid #f9fafb":"none"}}>
                  <span style={{fontSize:16,flexShrink:0}}>{ri(v.result)}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:14,color:"#111827"}}>{rl(v.result)}{v.result==="order"&&v.units?` · ${v.units} Stk.`:""}</div>
                    <div style={{fontSize:13,color:"#9ca3af"}}>{new Date(v.confirmed_at).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})} · {fmtT(v.confirmed_at)}{v.rep_id!==user.id?` · ${repName(v.rep_id)}`:""}</div>
                    <NoteLine note={v.note}/>
                  </div>
                  <span className={"badge "+(v.status==="confirmed"?"badge-ok":v.status==="warning"?"badge-warn":"badge-err")}>{v.distance<9999?v.distance+"m":"GPS?"}</span>
                </div>
              ))}
            </div>
          }
        </div>
      </div>
    </div>
  );
}

/* Načte workdays z posledních 90 dní z localStorage (fallback režim) */
function loadAllLocalWorkdays(){
  const result=[];
  for(let i=0;i<90;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().split("T")[0];
    const wds=ls("actio_wd_"+ds,[]);
    result.push(...wds);
  }
  return result;
}

function safeVisit(data,id){
  // Do not rewrite stored history. Prevent a malformed record crashing all views.
  return {...data,id,confirmed_at:typeof data.confirmed_at==="string"?data.confirmed_at:"",note:typeof data.note==="string"?data.note:""};
}
function App(){
  const DB=window.db;
  const [screen,setScreen]=useState("login");
  const [user,setUser]=useState(null);
  const [visits,setVisits]=useState([]);
  const [workdays,setWorkdays]=useState([]);
  const [cust,setCust]=useState(null);
  const [detailCust,setDetailCust]=useState(null);
  const [prevScreen,setPrevScreen]=useState("home");
  const [fbLoading,setFbLoading]=useState(true);
  const [loadError,setLoadError]=useState("");
  const [auditLogs,setAuditLogs]=useState([]);
  const [newCusts,setNewCusts]=useState([]);
  const [customerRevision,setCustomerRevision]=useState(0);
  useEffect(()=>{
    if(!window.irisAuth||!DB){setLoadError("Verbindung nicht verfügbar. Bitte neu laden.");setFbLoading(false);return;}
    return window.irisAuth.onAuthStateChanged(authUser=>{
      CUSTOMERS=[];HISTORY_CUSTOMERS=[];custById.m=null;
      setVisits([]);setWorkdays([]);setAuditLogs([]);setNewCusts([]);
      setCust(null);setDetailCust(null);setLoadError("");
      const id=authUser&&IRIS_UIDS[authUser.uid];
      const profile=id&&USERS.find(u=>u.id===id);
      if(!profile){setUser(null);setScreen("login");setFbLoading(false);return;}
      setFbLoading(true);setUser({...profile,uid:authUser.uid});
      setScreen(profile.role==="manager"?"dashboard":"home");
    },()=>{setLoadError("Anmeldung nicht verfügbar.");setFbLoading(false);});
  },[]);
  useEffect(()=>{
    if(!user||!DB)return;
    let alive=true;
    const ready=new Set();
    const count=user.role==="manager"?6:5;
    const done=name=>{ready.add(name);if(alive&&ready.size===count)setFbLoading(false);};
    const fail=()=>{if(alive){setLoadError("Daten konnten nicht vollständig geladen werden. Bitte erneut anmelden oder Administrator kontaktieren.");setFbLoading(false);}};
    const scoped=(name,field)=>user.role==="manager"?DB.collection(name):DB.collection(name).where(field,'==',user.id);
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);
    const cutStr=cutoff.toISOString().split("T")[0];
    const unsubs=[
      scoped('historical_customers','viewer_rep_id').onSnapshot(snap=>{if(!alive)return;HISTORY_CUSTOMERS=snap.docs.map(d=>d.data());custById.m=null;setCustomerRevision(n=>n+1);done('historical_customers');},fail),
      scoped('customers','rep_id').onSnapshot(snap=>{if(!alive)return;CUSTOMERS=snap.docs.map(d=>d.data()).sort((a,b)=>(a._irisOrder??0)-(b._irisOrder??0));custById.m=null;setCustomerRevision(n=>n+1);done('customers');},fail),
      scoped('visits','rep_id').onSnapshot(snap=>{if(!alive)return;setVisits(snap.docs.map(d=>safeVisit(d.data(),d.id)).filter(v=>v.confirmed_at.split("T")[0]>=cutStr));done('visits');},fail),
      scoped('workdays','user_id').onSnapshot(snap=>{if(!alive)return;setWorkdays(snap.docs.map(d=>d.data()));done('workdays');},fail),
      scoped('new_customers','rep_id').onSnapshot(snap=>{if(!alive)return;setNewCusts(snap.docs.map(d=>({...d.data(),id:d.id})));done('new_customers');},fail)
    ];
    if(user.role==="manager")unsubs.push(DB.collection('audit_log').orderBy('timestamp','desc').limit(20).onSnapshot(snap=>{if(!alive)return;setAuditLogs(snap.docs.map(d=>({...d.data(),id:d.id})));done('audit');},fail));
    return()=>{alive=false;unsubs.forEach(f=>f());};
  },[user?.uid]);
  const login=()=>{};
  const logout=()=>window.irisAuth.signOut();
  const goDetail=c=>{setPrevScreen(screen);setDetailCust(c);setScreen("custdetail");};
  const write=async operation=>{
    if(!user||window.irisAuth?.currentUser?.uid!==user.uid){alert("Bitte erneut anmelden.");return false;}
    try{await operation();return true;}
    catch(e){console.error("[Iris] Speichern fehlgeschlagen:",e.code||"error");alert("Nicht gespeichert. Bitte Verbindung und Berechtigung prüfen und erneut versuchen.");return false;}
  };
  const addVisit=async v=>{
    const ok=await write(async()=>{
      const {_cityPos,id:_,...data}=v;
      data.rep_id=user.id;
      const batch=DB.batch();
      batch.set(DB.collection('visits').doc(),data);
      if(_cityPos&&String(v.customer_id).startsWith("new_"))batch.update(DB.collection('new_customers').doc(String(v.customer_id)),{lat:_cityPos.lat,lng:_cityPos.lng});
      await batch.commit();
    });
    if(ok)setScreen("home");return ok;
  };
  const mutateVisit=(id,changes,audit)=>write(async()=>{
    const ref=DB.collection('visits').doc(String(id));
    await DB.runTransaction(async tx=>{
      const snap=await tx.get(ref);if(!snap.exists)throw new Error('missing');
      const before=snap.data();
      if(audit){const after=changes?{...before,...changes}:null;tx.set(DB.collection('audit_log').doc(),{repEmail:user.email,rep_id:user.id,actor_uid:user.uid,action:changes?'edited':'deleted',timestamp:Date.now(),visitId:String(id),before,after});}
      if(changes)tx.update(ref,changes);else tx.delete(ref);
    });
  });
  const deleteVisit=id=>mutateVisit(id,null,false);
  const editVisit=(id,changes)=>mutateVisit(id,changes,false);
  const deleteVisitAudit=id=>mutateVisit(id,null,true);
  const editVisitAudit=(id,changes)=>mutateVisit(id,changes,true);
  const clearAuditLog=()=>write(async()=>{
    if(user.role!=="manager")throw new Error('forbidden');
    const snap=await DB.collection('audit_log').get();
    for(let i=0;i<snap.docs.length;i+=400){const batch=DB.batch();snap.docs.slice(i,i+400).forEach(d=>batch.delete(d.ref));await batch.commit();}
  });
  const addNewCustomer=nc=>write(()=>DB.collection('new_customers').doc(String(nc.id)).set({...nc,rep_id:user.id}));
  const editNewCustomer=(id,changes)=>write(()=>DB.collection('new_customers').doc(String(id)).update(changes));
  const myWorkday=user?workdays.find(w=>w.user_id===user.id&&w.date===TODAY):null;
  const saveWorkday=async wd=>{const ok=await write(()=>DB.collection('workdays').doc(`${user.id}_${wd.date}`).set({...wd,user_id:user.id,id:Date.now()}));if(ok)setScreen("home");};
  const saveOvernight=async overnight=>{const ok=await write(()=>DB.collection('workdays').doc(`${user.id}_${TODAY}`).update({overnight}));if(ok)setScreen("home");};
  if(loadError)return <div style={{padding:40,color:"white"}}>{loadError}<br/><button onClick={()=>window.location.reload()}>Neu laden</button><button onClick={logout}>Abmelden</button></div>;
  if(fbLoading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#232323",color:"rgba(255,255,255,.75)",fontSize:16,fontWeight:700,fontFamily:"Montserrat,sans-serif",gap:12}}>⏳ Verbindung wird hergestellt…</div>;
  if(!user||screen==="login") return <LoginScreen onLogin={login}/>;

  return (
    <div className="app-root">
      <Sidebar user={user} workday={myWorkday} visits={visits} onLogout={logout} onSetDay={()=>setScreen("dayset")}/>
      {screen==="home"       && <HomeScreen user={user} visits={visits} workday={myWorkday} workdays={workdays} newCusts={newCusts} onNewVisit={()=>setScreen("search")} onSetOvernight={()=>setScreen("overnight")} onDeleteVisit={deleteVisit} onEditVisit={editVisit} onEditNewCust={editNewCustomer} onDeleteVisitAudit={deleteVisitAudit} onEditVisitAudit={editVisitAudit} onCustDetail={goDetail}/>}
      {screen==="dayset"     && <DaySetupScreen user={user} existing={myWorkday} onBack={()=>setScreen("home")} onSave={saveWorkday}/>}
      {screen==="overnight"  && <OvernightScreen workday={myWorkday} onBack={()=>setScreen("home")} onSave={saveOvernight}/>}
      {screen==="search"     && <CustomerSearchScreen user={user} visits={visits} newCusts={newCusts} onBack={()=>setScreen("home")} onSelect={c=>{setCust(c);setScreen("confirm");}} onNewCustomer={()=>setScreen("neukunde")} onDetail={goDetail}/>}
      {screen==="neukunde"   && <NewCustomerScreen user={user} onBack={()=>setScreen("search")} onSave={async c=>{if(await addNewCustomer(c)){setCust(c);setScreen("confirm");}}}/>}
      {screen==="confirm"    && <VisitConfirmScreen user={user} customer={cust} onBack={()=>setScreen("search")} onConfirm={addVisit}/>}
      {screen==="dashboard"  && <DashboardScreen visits={visits} workdays={workdays} auditLogs={auditLogs} newCusts={newCusts} clearAuditLog={clearAuditLog}/>}
      {screen==="custdetail" && <CustomerDetailScreen user={user} customer={detailCust} visits={visits} onBack={()=>setScreen(prevScreen)}/>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
<script>
// PWA icon + manifest
(function(){
  // Generate icon via canvas
  const c=document.createElement("canvas");
  c.width=c.height=512;
  const ctx=c.getContext("2d");
  // Dark rounded background (same as sidebar #232323)
  const r=90;
  ctx.fillStyle="#232323";
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(512-r,0);ctx.quadraticCurveTo(512,0,512,r);
  ctx.lineTo(512,512-r);ctx.quadraticCurveTo(512,512,512-r,512);
  ctx.lineTo(r,512);ctx.quadraticCurveTo(0,512,0,512-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();ctx.fill();
  // Subtle circle decoration (like sidebar ::before)
  ctx.fillStyle="rgba(255,255,255,.07)";
  ctx.beginPath();ctx.arc(420,90,200,0,Math.PI*2);ctx.fill();
  // "Iris" centered
  ctx.fillStyle="white";
  ctx.font="bold 140px Montserrat,Arial,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("Iris",256,256);
  const iconUrl=c.toDataURL("image/png");
  document.getElementById("pwa-icon").href=iconUrl;
  // Manifest
  const m={name:"Iris – Prague Eyewear",short_name:"Iris",start_url:"/",display:"standalone",background_color:"#232323",theme_color:"#232323",icons:[{src:iconUrl,sizes:"512x512",type:"image/png"}]};
  const url=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/json"}));
  document.getElementById("pwa-manifest").href=url;
})();
</script>
