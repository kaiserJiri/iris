const RESULTS = [
  { value:"order",        label:"Bestellung",              icon:"🛒" },
  { value:"absent",       label:"Kunde nicht anwesend",   icon:"🚪" },
  { value:"follow_up",    label:"Folgetermin vereinbart",  icon:"📅" },
  { value:"no_interest",  label:"Kein Interesse",          icon:"❌" },
  { value:"sonstige",     label:"Sonstige",                icon:"📝" },
];

const rl=v=>RESULTS.find(r=>r.value===v)?.label||v;
const ri=v=>RESULTS.find(r=>r.value===v)?.icon||"•";

function haversine(la1,lo1,la2,lo2){
  const R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}
function gpsInfo(d){
  if(d===null) return{cls:"load",icon:"⏳",text:"GPS wird geladen...",ok:false};
  if(d<=25000) return{cls:"ok",  icon:"✓", text:(d<1000?d+" m":(d/1000).toFixed(1)+" km")+" — Bestätigt",ok:true};
  return            {cls:"err", icon:"✗", text:(d/1000).toFixed(1)+" km — Außerhalb (Limit 25 km)",ok:false};
}
function fmtT(iso){try{return new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}catch{return "";}}

function Badge({status}){
  const m=status==="confirmed"?"badge-ok":status==="warning"?"badge-warn":"badge-err";
  const t=status==="confirmed"?"✓ GPS":status==="warning"?"⚠ GPS":"✗ GPS";
  return <span className={"badge "+m}>{t}</span>;
}

/* ── SIDEBAR — stejná struktura jako login-left ── */
function Sidebar({user,workday,visits,onLogout,onSetDay}){
  const ds=workday?dsInfo(workday.day_status):null;
  const av={width:54,height:54,borderRadius:"50%",background:OG,color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:900,flexShrink:0};
  const weekStart=(()=>{const d=new Date();const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);const nd=new Date(d);nd.setDate(diff);return nd.toISOString().split("T")[0];})();
  const [dark,setDark]=useState(()=>localStorage.getItem("iris_dark")==="1");
  useEffect(()=>{document.body.classList.toggle("dark",dark);localStorage.setItem("iris_dark",dark?"1":"0");},[dark]);
  const wv=(visits||[]).filter(v=>v.rep_id===user.id&&v.confirmed_at.split("T")[0]>=weekStart);
  const wo=wv.filter(v=>v.result==="order");
  const visitPct=Math.min(100,wv.length/14*100);
  const orderPct=Math.min(100,wo.length/7*100);
  return (
    <div className="sidebar">
      <div className="sidebar-content">
        <div style={{flex:1}}/>
        <div style={{position:"relative",zIndex:1}}>
          {/* Logo */}
          <img src="logoinline.png" className="mobile-logo app-sidebar-logo" style={{width:200,height:"auto",display:"block",marginBottom:10,filter:"brightness(0) invert(1)"}} alt="Prague Eyewear"/>
          <div className="mobile-iris app-sidebar-iris" style={{fontSize:12,fontWeight:600,color:"rgba(255,255,255,.55)",letterSpacing:".3em",textTransform:"uppercase",marginBottom:22}}>Iris</div>
          {/* User info */}
          <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:24}}>
            <div style={av}>{user.initials}</div>
            <div>
              <div style={{fontSize:18,fontWeight:900,color:"white",lineHeight:1.2}}>{user.name}</div>
            </div>
          </div>
          {/* Tagesstatus — nur für Vertreter */}
          {user.role!=="manager"&&<>
          <div style={{fontSize:12,color:"rgba(255,255,255,.5)",fontWeight:700,textTransform:"uppercase",letterSpacing:".15em",marginBottom:10}}>Tagesstatus</div>
          {workday&&ds ? (
            <button onClick={onSetDay} style={{width:"100%",background:"linear-gradient(135deg,#1a4b8c,#2C8CD1)",borderRadius:16,padding:"16px 18px",border:"none",cursor:"pointer",fontFamily:"inherit",marginBottom:14,display:"flex",alignItems:"center",gap:14,textAlign:"left"}}>
              <div style={{width:50,height:50,borderRadius:"50%",background:"rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{ds.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:20,fontWeight:900,color:"white",textTransform:"uppercase",letterSpacing:".03em",lineHeight:1.1,marginBottom:6}}>{ds.label}</div>
                {workday.day_status==="aussendienst"&&workday.start_location&&<div style={{fontSize:14,fontWeight:700,color:"rgba(255,255,255,.9)",display:"flex",alignItems:"center",gap:6}}>🏠 Start: {locInfo(workday.start_location)?.label}</div>}
                {workday.day_status==="messe"&&workday.event_name&&<div style={{fontSize:14,fontWeight:700,color:"rgba(255,255,255,.9)"}}>{workday.event_name}</div>}
                {workday.overnight&&<div style={{fontSize:14,fontWeight:700,color:"rgba(255,255,255,.9)",display:"flex",alignItems:"center",gap:6,marginTop:2}}>🛏 Übernachtung: {overnightLocInfo(workday.overnight)?.label}</div>}
              </div>
              <div style={{fontSize:22,color:"rgba(255,255,255,.7)",flexShrink:0}}>›</div>
            </button>
          ) : (
            <button onClick={onSetDay} style={{width:"100%",background:"linear-gradient(135deg,#1a4b8c,#2C8CD1)",borderRadius:16,padding:"18px",border:"none",cursor:"pointer",fontFamily:"inherit",marginBottom:14,display:"flex",alignItems:"center",gap:12,textAlign:"left"}}>
              <div style={{width:46,height:46,borderRadius:"50%",background:"rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>📋</div>
              <div style={{flex:1}}>
                <div style={{fontSize:17,fontWeight:900,color:"white",textTransform:"uppercase",letterSpacing:".03em"}}>Tag einrichten</div>
                <div style={{fontSize:13,color:"rgba(255,255,255,.7)",marginTop:3}}>Tippen um zu starten</div>
              </div>
              <div style={{fontSize:22,color:"rgba(255,255,255,.7)"}}>›</div>
            </button>
          )}
          </>}
          {/* Wochenprogress — nur für Vertreter */}
          {user.role!=="manager"&&<div className="prog-section">
            <div className="prog-head">Diese Woche</div>
            {[{l:"Besuche",v:wv.length,pct:visitPct,c:OG},{l:"Bestellungen",v:wo.length,pct:orderPct,c:"#16a34a"}].map(p=>(
              <div key={p.l} className="prog-row">
                <div className="prog-lbl">{p.l}</div>
                <div className="prog-track"><div className="prog-fill" style={{width:p.pct+"%",background:p.c}}/></div>
                <div className="prog-val">{p.v}</div>
              </div>
            ))}
          </div>}
          {/* Dark mode toggle */}
          <button onClick={()=>setDark(d=>!d)} style={{background:"rgba(255,255,255,.1)",border:"none",cursor:"pointer",fontFamily:"inherit",padding:"8px 14px",fontSize:12,fontWeight:600,color:"rgba(255,255,255,.6)",borderRadius:10,marginTop:12,width:"100%",textAlign:"left"}}>
            {dark?"☀ Heller Modus":"🌙 Dunkler Modus"}
          </button>
          {/* Abmelden */}
          <button onClick={onLogout} style={{background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",padding:"8px 0",fontSize:13,fontWeight:600,color:"rgba(255,255,255,.4)",letterSpacing:".04em",marginTop:8}}>

          </button>
        </div>
        <div style={{flex:2}}/>
      </div>
    </div>
  );
}

/* ── LOGIN ── */
function LoginScreen({onLogin}){

    onLogin(u);

      <div className="login-left">

        <div style={{position:"relative",zIndex:1}}>

          <div className="mobile-iris" style={{fontSize:12,fontWeight:600,color:"rgba(255,255,255,.55)",letterSpacing:".3em",textTransform:"uppercase",marginBottom:0}}>Iris</div>

        <div style={{flex:2}}/>

            <div style={{fontSize:15,color:"#9ca3af"}}>Geben Sie Ihre Anmeldedaten ein</div>
          </div>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:".08em",marginBottom:6}}>E-mail</div>
            <input placeholder="vas@mi-optics.de" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}}/>
          </div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:13,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:".08em",marginBottom:6}}>Passwort</div>
            <input type="password" placeholder="••••••" value={pass} onChange={e=>{setPass(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&go()}/>
          </div>
          {err&&<div style={{color:"#ef4444",fontSize:12,fontWeight:600,marginBottom:14,padding:"10px 14px",background:"#fef2f2",borderRadius:10}}>{err}</div>}

        </div>
      </div>
    </div>
  );
}

/* ── HOME ── */
function HomeScreen({user,visits,workday,newCusts,onNewVisit,onSetOvernight,onDeleteVisit,onEditVisit,onEditNewCust,onDeleteVisitAudit,onEditVisitAudit,onCustDetail}){
  const mine=visits.filter(v=>v.rep_id===user.id&&v.confirmed_at.startsWith(TODAY));
  const allCusts=React.useMemo(()=>[...CUSTOMERS,...(newCusts||[])],[newCusts]);
  const lookupCust=id=>allCusts.find(c=>String(c.id)===String(id));
  const [dialog,setDialog]=useState(null); // {type:'delete'|'edit', visit}
  const [editResult,setEditResult]=useState(""); const [editNote,setEditNote]=useState("");
  const [editCustName,setEditCustName]=useState(""); const [editCustCity,setEditCustCity]=useState("");
  const [showHistory,setShowHistory]=useState(false);
  const [historyMonth,setHistoryMonth]=useState(TODAY.slice(0,7));
  const [selectedHistoryDay,setSelectedHistoryDay]=useState(null);
  const [histDialog,setHistDialog]=useState(null);
  const [histEditResult,setHistEditResult]=useState("");
  const [histEditNote,setHistEditNote]=useState("");
  const orders=mine.filter(v=>v.result==="order");
  const ds=workday?dsInfo(workday.day_status):null;
  const isAD=workday?.day_status==="aussendienst";
  const needOvernight=isAD&&!workday.overnight;
  const lastVisitMap={};
  visits.filter(v=>v.rep_id===user.id).forEach(v=>{const d=v.confirmed_at.split("T")[0];if(!lastVisitMap[v.customer_id]||d>lastVisitMap[v.customer_id])lastVisitMap[v.customer_id]=d;});
  const cut60=new Date();cut60.setDate(cut60.getDate()-60);const cut60str=cut60.toISOString().split("T")[0];
  const overdueList=isAD?CUSTOMERS.filter(c=>c.rep_id===user.id).map(c=>({...c,lastDate:lastVisitMap[c.id]||null,days:lastVisitMap[c.id]?Math.floor((Date.now()-new Date(lastVisitMap[c.id]))/86400000):999})).filter(c=>!lastVisitMap[c.id]||lastVisitMap[c.id]<cut60str).sort((a,b)=>b.days-a.days).slice(0,5):[];

  // ── VERLAUF (History Calendar) ──
  if(showHistory){
    const [hy,hm]=historyMonth.split("-").map(Number);
    const daysInMonth=new Date(hy,hm,0).getDate();
    const firstDow=new Date(hy,hm-1,1).getDay();
    const adjHM=n=>{const d=new Date(hy,hm-1+n,1);setHistoryMonth(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);setSelectedHistoryDay(null);};
    const hML=()=>new Date(hy,hm-1,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
    const hColor=cnt=>cnt===0?"#f3f4f6":cnt<=2?"#fed7aa":"#e87722";
    const DOW7H=["So","Mo","Di","Mi","Do","Fr","Sa"];
    const cells=[];
    for(let i=0;i<firstDow;i++) cells.push(null);
    for(let d=1;d<=daysInMonth;d++){
      const dateStr=`${hy}-${String(hm).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const dv=visits.filter(v=>v.rep_id===user.id&&v.confirmed_at.startsWith(dateStr));
      cells.push({d,dateStr,dv});
    }
    const weeks=[];for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
    const selDV=selectedHistoryDay?[...visits.filter(v=>v.rep_id===user.id&&v.confirmed_at.startsWith(selectedHistoryDay))].sort((a,b)=>b.confirmed_at.localeCompare(a.confirmed_at)):[];
    return(
      <div className="main-panel">
        <div className="panel-header">
          <button className="back-btn" onClick={()=>setShowHistory(false)}>‹</button>
          <div style={{flex:1}}>
            <div className="panel-header-title">Verlauf</div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginTop:2}}>
              <button onClick={()=>adjHM(-1)} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,padding:"0 4px",color:"#9ca3af"}}>‹</button>
              <span style={{fontSize:13,fontWeight:600,color:"#6b7280"}}>{hML()}</span>
              <button onClick={()=>adjHM(1)} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,padding:"0 4px",color:"#9ca3af"}}>›</button>
            </div>
          </div>
        </div>
        <div className="panel-body">
          <div style={{maxWidth:580,width:"100%"}}>
            <div style={{background:"white",borderRadius:14,border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",padding:"16px",marginBottom:16}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
                {DOW7H.map(d=><div key={d} style={{fontSize:11,fontWeight:700,color:"#9ca3af",textAlign:"center"}}>{d}</div>)}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                {weeks.map((week,wi)=>(
                  <div key={wi} style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
                    {Array.from({length:7},(_,ci)=>{
                      const cell=week[ci];
                      if(!cell) return <div key={ci}/>;
                      const cnt=cell.dv.length;
                      const isSel=selectedHistoryDay===cell.dateStr;
                      const isT=cell.dateStr===TODAY;
                      return(
                        <div key={cell.dateStr} onClick={()=>setSelectedHistoryDay(isSel?null:cell.dateStr)}
                          style={{aspectRatio:"1",background:isSel?"#2C8CD1":hColor(cnt),borderRadius:8,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",border:isT?"2px solid #2C8CD1":"2px solid transparent",transition:"all .1s"}}>
                          <div style={{fontSize:11,fontWeight:700,color:isSel?"white":cnt>0?"#7c2d00":"#6b7280"}}>{cell.d}</div>
                          {cnt>0&&<div style={{fontSize:10,fontWeight:900,color:isSel?"white":"#c2410c"}}>{cnt}</div>}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
              <div style={{display:"flex",gap:8,marginTop:12,alignItems:"center"}}>
                <span style={{fontSize:11,color:"#9ca3af"}}>0</span>
                {["#f3f4f6","#fed7aa","#e87722"].map((c,i)=><div key={i} style={{width:14,height:14,background:c,borderRadius:3}}/>)}
                <span style={{fontSize:11,color:"#9ca3af"}}>3+</span>
              </div>
            </div>
            {selectedHistoryDay&&(
              <div>
                <div className="section-label">{new Date(selectedHistoryDay+"T12:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}</div>
                {selDV.length===0?(
                  <div style={{textAlign:"center",padding:"24px",color:"#9ca3af",fontSize:15}}>Keine Besuche</div>
                ):(
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {selDV.map(v=>{
                      const c=lookupCust(v.customer_id);
                      const iab={background:"none",border:"none",cursor:"pointer",fontSize:17,padding:"6px 8px",borderRadius:8,lineHeight:1};
                      return(
                        <div key={v.id} className="card" style={{display:"flex",alignItems:"center",gap:12}}>
                          <div style={{fontSize:22,width:30,textAlign:"center",flexShrink:0}}>{ri(v.result)}</div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontWeight:700,fontSize:16,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c?.name||v.customer_id}</div>
                            <div style={{fontSize:14,color:"#9ca3af"}}>{fmtT(v.confirmed_at)} · {rl(v.result)}{v.note?` · ${v.note}`:""}</div>
                          </div>
                          <button onClick={()=>{setHistEditResult(v.result);setHistEditNote(v.note||"");setHistDialog({type:"edit",visit:v});}} style={{...iab,background:"#EFF6FC"}}>✏️</button>
                          <button onClick={()=>setHistDialog({type:"delete",visit:v})} style={{...iab,background:"#FEF2F2"}}>🗑️</button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
            {histDialog&&(
              <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setHistDialog(null)}>
                <div style={{background:"white",borderRadius:20,padding:24,maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}} onClick={e=>e.stopPropagation()}>
                  {histDialog.type==="delete"?<>
                    <div style={{textAlign:"center",fontSize:36,marginBottom:12}}>🗑️</div>
                    <div style={{fontWeight:900,fontSize:18,textAlign:"center",marginBottom:6}}>Besuch löschen?</div>
                    <div style={{fontSize:15,color:"#6b7280",textAlign:"center",marginBottom:24}}>{lookupCust(histDialog.visit.customer_id)?.name||histDialog.visit.customer_id} · {rl(histDialog.visit.result)}</div>
                    <div style={{display:"flex",gap:10}}>
                      <button onClick={()=>setHistDialog(null)} style={{flex:1,padding:"12px",borderRadius:10,background:"#f3f4f6",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Abbrechen</button>
                      <button onClick={()=>{onDeleteVisitAudit(histDialog.visit.id,histDialog.visit);setHistDialog(null);}} style={{flex:1,padding:"12px",borderRadius:10,background:"#dc2626",color:"white",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Löschen</button>
                    </div>
                  </>:<>
                    <div style={{fontWeight:900,fontSize:18,marginBottom:16}}>Besuch bearbeiten</div>
                    <div style={{fontSize:13,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}}>Ergebnis</div>
                    <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:16}}>
                      {RESULTS.map(r=>(
                        <button key={r.value} onClick={()=>setHistEditResult(r.value)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:10,border:`2px solid ${histEditResult===r.value?OG:"#e5e7eb"}`,background:histEditResult===r.value?"#EFF6FC":"white",cursor:"pointer",fontFamily:"inherit",fontWeight:histEditResult===r.value?700:500,textAlign:"left"}}>
                          <span style={{fontSize:18,width:24,textAlign:"center"}}>{r.icon}</span>
                          <span style={{fontSize:15}}>{r.label}</span>
                          {histEditResult===r.value&&<span style={{marginLeft:"auto",color:OG}}>✓</span>}
                        </button>
                      ))}
                    </div>
                    <div style={{fontSize:13,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:8}}>Notiz</div>
                    <textarea rows={2} value={histEditNote} onChange={e=>setHistEditNote(e.target.value)} placeholder="Kurze Notiz…" style={{resize:"none",marginBottom:16}}/>
                    <div style={{display:"flex",gap:10}}>
                      <button onClick={()=>setHistDialog(null)} style={{flex:1,padding:"12px",borderRadius:10,background:"#f3f4f6",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Abbrechen</button>
                      <button onClick={()=>{onEditVisitAudit(histDialog.visit.id,{result:histEditResult,note:histEditNote},histDialog.visit);setHistDialog(null);}} style={{flex:1,padding:"12px",borderRadius:10,background:OG,color:"white",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Speichern</button>
                    </div>
                  </>}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="main-panel">
      <div className="panel-header">
        <div style={{flex:1}}>
          <div className="panel-header-title">Hallo, {user.name.split(" ")[0]}</div>
          <div className="panel-header-sub">{new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
        </div>
        <button onClick={()=>{setShowHistory(true);setSelectedHistoryDay(null);}} style={{background:"#f3f4f6",border:"none",borderRadius:8,padding:"7px 13px",cursor:"pointer",fontWeight:700,fontSize:13,color:"#374151",fontFamily:"inherit"}}>📅 Verlauf</button>
      </div>
      <div className="panel-body">
        <div style={{maxWidth:580,width:"100%"}}>
        {isAD&&<>
          <button className="btn-primary" onClick={onNewVisit} style={{fontSize:17,padding:"18px 0",marginBottom:14}}>
            <span style={{fontSize:22}}>📍</span><span>KUNDENBESUCH BESTÄTIGEN</span>
          </button>
          {mine.length>0&&<>
            <div className="section-label" style={{marginTop:8}}>Kundenbesuche heute</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {[...mine].sort((a,b)=>b.confirmed_at.localeCompare(a.confirmed_at)).map(v=>{
                const c=lookupCust(v.customer_id);
                const iab={background:"none",border:"none",cursor:"pointer",fontSize:17,padding:"6px 8px",borderRadius:8,lineHeight:1};
                return (
                  <div key={v.id} className="card" style={{display:"flex",alignItems:"center",gap:12}}>
                    <div style={{fontSize:22,width:30,textAlign:"center",flexShrink:0}}>{ri(v.result)}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <button onClick={()=>onCustDetail&&onCustDetail(c)} style={{background:"none",border:"none",padding:0,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:16,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"#111827",textDecoration:"underline",textDecorationColor:"#e5e7eb",maxWidth:"100%",display:"block",textAlign:"left"}}>{c?.name||v.customer_id}</button>
                      <div style={{fontSize:14,color:"#9ca3af"}}>{fmtT(v.confirmed_at)} · {rl(v.result)}{v.note?` · ${v.note}`:""}</div>
                    </div>
                    <Badge status={v.status}/>
                    <button onClick={()=>{setEditResult(v.result);setEditNote(v.note||"");setEditCustName("");setEditCustCity("");setDialog({type:"edit",visit:v});}} style={{...iab,background:"#EFF6FC"}}>✏️</button>
                    <button onClick={()=>setDialog({type:"delete",visit:v})} style={{...iab,background:"#FEF2F2"}}>🗑️</button>
                  </div>
                );
              })}
            </div>
          </>}
          {dialog&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setDialog(null)}>
              <div style={{background:"white",borderRadius:20,padding:24,maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}} onClick={e=>e.stopPropagation()}>
                {dialog.type==="delete"?<>
                  <div style={{textAlign:"center",fontSize:36,marginBottom:12}}>🗑️</div>
                  <div style={{fontWeight:900,fontSize:18,textAlign:"center",marginBottom:6}}>Besuch löschen?</div>
                  <div style={{fontSize:15,color:"#6b7280",textAlign:"center",marginBottom:24}}>{lookupCust(dialog.visit.customer_id)?.name||dialog.visit.customer_id} · {rl(dialog.visit.result)}</div>
                  <div style={{display:"flex",gap:10}}>
                    <button onClick={()=>setDialog(null)} style={{flex:1,padding:"12px",borderRadius:10,background:"#f3f4f6",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Abbrechen</button>
                    <button onClick={()=>{onDeleteVisitAudit(dialog.visit.id,dialog.visit);setDialog(null);}} style={{flex:1,padding:"12px",borderRadius:10,background:"#dc2626",color:"white",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Löschen</button>
                  </div>
                </>:<>
                  <div style={{fontWeight:900,fontSize:18,marginBottom:16}}>Besuch bearbeiten</div>
                  {String(dialog.visit.customer_id).startsWith('new_')&&(()=>{
                    const nc=lookupCust(dialog.visit.customer_id);
                    return(<div style={{marginBottom:16}}>
                      <div style={{fontSize:13,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:8}}>Kundenname</div>
                      <input value={editCustName} onChange={e=>setEditCustName(e.target.value)} placeholder={nc?.name||"Firmenname"} style={{marginBottom:8}}/>
                      <input value={editCustCity} onChange={e=>setEditCustCity(e.target.value)} placeholder={nc?.city||"Stadt"} style={{marginBottom:0}}/>
                    </div>);
                  })()}
                  <div style={{fontSize:13,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}}>Ergebnis</div>

                    {RESULTS.map(r=>(
                      <button key={r.value} onClick={()=>setEditResult(r.value)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:10,border:`2px solid ${editResult===r.value?OG:"#e5e7eb"}`,background:editResult===r.value?"#EFF6FC":"white",cursor:"pointer",fontFamily:"inherit",fontWeight:editResult===r.value?700:500,textAlign:"left"}}>
                        <span style={{fontSize:18,width:24,textAlign:"center"}}>{r.icon}</span>
                        <span style={{fontSize:15}}>{r.label}</span>
                        {editResult===r.value&&<span style={{marginLeft:"auto",color:OG}}>✓</span>}
                      </button>
                    ))}
                  </div>
                  <div style={{fontSize:13,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:8}}>Notiz</div>
                  <textarea rows={2} value={editNote} onChange={e=>setEditNote(e.target.value)} placeholder="Kurze Notiz…" style={{resize:"none",marginBottom:16}}/>
                  <div style={{display:"flex",gap:10}}>
                    <button onClick={()=>setDialog(null)} style={{flex:1,padding:"12px",borderRadius:10,background:"#f3f4f6",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Abbrechen</button>
                    <button onClick={()=>{
                      onEditVisit(dialog.visit.id,{result:editResult,note:editNote});
                      if(String(dialog.visit.customer_id).startsWith('new_')){
                        const changes={};
                        if(editCustName.trim())changes.name=editCustName.trim();
                        if(editCustCity.trim())changes.city=editCustCity.trim();
                        if(Object.keys(changes).length)onEditNewCust(dialog.visit.customer_id,changes);
                      }
                      setDialog(null);
                    }} style={{flex:1,padding:"12px",borderRadius:10,background:OG,color:"white",border:"none",cursor:"pointer",fontWeight:700,fontSize:15,fontFamily:"inherit"}}>Speichern</button>
                  </div>
                </>}
              </div>
            </div>
          )}
          {mine.length===0&&<div style={{textAlign:"center",padding:"48px 0",color:"#d1d5db"}}><div style={{fontSize:48,marginBottom:12}}>🗺</div><div style={{fontSize:16}}>Keine Besuche heute</div></div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:14,marginTop:24}}>
            {[{l:"Besuche heute",v:mine.length,c:OG},{l:"Bestellungen",v:orders.length,c:"#16a34a"}].map(s=>(
              <div key={s.l} className="stat-box">
                <div className="stat-num" style={{color:s.c}}>{s.v}</div>
                <div className="stat-lbl">{s.l}</div>
              </div>
            ))}
          </div>
          {overdueList.length>0&&<>
            <div className="section-label" style={{color:"#c2410c",marginTop:20}}>⏰ Lange nicht besucht</div>
            {overdueList.map(c=>(
              <button key={c.id} className="overdue-btn" onClick={()=>onCustDetail&&onCustDetail(c)}>
                <div className="overdue-days">{c.days===999?"NEU":c.days+"T"}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,color:"#1e293b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</div>
                  <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{c.postal} {c.city}{c.lastDate?` · ${new Date(c.lastDate).toLocaleDateString("de-DE")}`:" · noch nie besucht"}</div>
                </div>
                <div style={{fontSize:14,color:"#c2410c",fontWeight:700}}>›</div>
              </button>
            ))}
          </>}
        </>}
        {workday&&!isAD&&(
          <div style={{textAlign:"center",padding:"60px 0"}}>
            <div style={{fontSize:64,marginBottom:16}}>{ds?.icon}</div>
            <div style={{fontSize:24,fontWeight:900,color:"#111827"}}>{ds?.label}</div>
            {ds?.note&&<div style={{fontSize:14,color:"#9ca3af",marginTop:4}}>{ds.note}</div>}
            {workday.day_status==="messe"&&workday.event_name&&<div style={{fontSize:18,fontWeight:700,color:"#374151",marginTop:12}}>{workday.event_name}{workday.event_city?" · "+workday.event_city:""}</div>}
            {workday.note&&<div style={{fontSize:16,color:"#9ca3af",marginTop:8,fontStyle:"italic"}}>{workday.note}</div>}
          </div>

  const commit=(status,sl,on,en,ec,nt)=>onSave({user_id:user.id,date:TODAY,day_status:status,start_location:sl,overnight:on,event_name:en,event_city:ec,note:nt});

    setDayStatus(val);
    const noExtra=["homeoffice","buro","schulung","inventur","sonstige"];

function NewCustomerScreen({user,onBack,onSave}){
  const NK_KEY="actio_new_cust_"+user.id;
  const [newCusts,setNewCusts]=useState(()=>ls(NK_KEY,[]));
  const [nkName,setNkName]=useState(""); const [nkCity,setNkCity]=useState("");
  const [editNkId,setEditNkId]=useState(null);
  useEffect(()=>{localStorage.setItem(NK_KEY,JSON.stringify(newCusts));},[newCusts]);
  const saveNk=()=>{
    if(!nkName.trim())return;
    if(editNkId){setNewCusts(p=>p.map(c=>c.id===editNkId?{...c,name:nkName.trim(),city:nkCity.trim()}:c));setEditNkId(null);}
    else{const nc={id:"new_"+Date.now(),name:nkName.trim(),city:nkCity.trim(),postal:"",street:"",rep_id:user.id,lat:null,lng:null,isNew:true};setNewCusts(p=>[nc,...p]);onSave(nc);return;}
    setNkName("");setNkCity("");
  };
  const editNk=c=>{setEditNkId(c.id);setNkName(c.name);setNkCity(c.city);};
  const cancelEdit=()=>{setEditNkId(null);setNkName("");setNkCity("");};
  const deleteNk=id=>{setNewCusts(p=>p.filter(c=>c.id!==id));if(editNkId===id)cancelEdit();};
  const nkBtnStyle={background:"none",border:"none",borderRadius:8,padding:"7px 10px",cursor:"pointer",fontSize:17,lineHeight:1};
  return (
    <div className="main-panel">
      <div className="panel-header">
        <button className="back-btn" onClick={onBack}>‹</button>
        <div className="panel-header-title">Neukunde hinzufügen</div>
      </div>
      <div className="panel-body">
        <div style={{maxWidth:580,width:"100%"}}>
          <div style={{background:"#f9fafb",borderRadius:14,padding:"16px",marginBottom:16,border:"1.5px solid #e5e7eb"}}>
            <input placeholder="Geschäftsname" value={nkName} onChange={e=>setNkName(e.target.value)} style={{marginBottom:10}} onKeyDown={e=>e.key==="Enter"&&saveNk()}/>

            <div style={{display:"flex",gap:8}}>
              <button onClick={saveNk} disabled={!nkName.trim()||!nkCity.trim()} style={{flex:1,background:(nkName.trim()&&nkCity.trim())?OG:"#d1d5db",color:"white",border:"none",borderRadius:8,padding:"11px",fontWeight:700,cursor:(nkName.trim()&&nkCity.trim())?"pointer":"default",fontFamily:"inherit",fontSize:15,transition:"background .2s"}}>
                {editNkId?"Speichern ✓":"Hinzufügen +"}
              </button>
              {editNkId&&<button onClick={cancelEdit} style={{background:"#e5e7eb",border:"none",borderRadius:8,padding:"11px 16px",cursor:"pointer",fontFamily:"inherit",fontWeight:600,fontSize:14}}>Abbrechen</button>}
            </div>
          </div>
          {newCusts.length>0&&<>
            <div className="section-label" style={{marginTop:4}}>Neue Kunden ({newCusts.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {newCusts.map(c=>(
                <div key={c.id} style={{display:"flex",alignItems:"center",gap:6,background:"white",borderRadius:12,border:editNkId===c.id?"2px solid "+OG:"1.5px solid #e5e7eb",padding:"12px 14px",boxSizing:"border-box"}}>
                  <button onClick={()=>onSave(c)} style={{flex:1,background:"none",border:"none",cursor:"pointer",textAlign:"left",fontFamily:"inherit",padding:0}}>
                    <div style={{fontWeight:700,fontSize:15,color:"#111827"}}>{c.name}</div>
                    {c.city&&<div style={{fontSize:13,color:"#9ca3af",marginTop:2}}>{c.city}</div>}
                  </button>
                  <button onClick={()=>editNk(c)} title="Bearbeiten" style={{...nkBtnStyle,background:"#EFF6FC"}}>✏️</button>
                  <button onClick={()=>deleteNk(c.id)} title="Löschen" style={{...nkBtnStyle,background:"#FEF2F2"}}>🗑️</button>
                </div>
              ))}
            </div>
          </>}
        </div>
      </div>
    </div>
  );
}

/* ── SEARCH ── */
function CustomerSearchScreen({user,visits,onBack,onSelect,onNewCustomer,onDetail}){
  const [q,setQ]=useState(""); const [pos,setPos]=useState(null);
  useEffect(()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>setPos({lat:p.coords.latitude,lng:p.coords.longitude}),()=>{});},[]);
  const mine=user.role==="manager"?CUSTOMERS:CUSTOMERS.filter(c=>c.rep_id===user.id);
  const filtered=q.length>=1?mine.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||c.city.toLowerCase().includes(q.toLowerCase())||c.postal.includes(q)):[];
  const nearby=pos?[...mine].map(c=>({...c,_d:haversine(pos.lat,pos.lng,c.lat,c.lng)})).sort((a,b)=>a._d-b._d).slice(0,8):[];
  const Row=({c,dist})=>{
    const last=[...visits].filter(v=>v.rep_id===user.id&&v.customer_id===c.id).sort((a,b)=>b.confirmed_at.localeCompare(a.confirmed_at))[0];
    const tod=last?.confirmed_at?.startsWith(TODAY);

          <div style={{width:46,height:46,borderRadius:"50%",background:"#EFF6FC",color:OG,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:16,flexShrink:0}}>{c.name.charAt(0)}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:16,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</div>
            <div style={{fontSize:14,color:"#9ca3af",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.postal} {c.city} · {c.street}</div>
          </div>
          <div style={{flexShrink:0,textAlign:"right"}}>
            {dist!==undefined&&<div style={{fontSize:14,color:"#9ca3af"}}>{dist<1000?dist+" m":(dist/1000).toFixed(1)+" km"}</div>}
            {tod&&<div style={{fontSize:13,color:"#16a34a",fontWeight:700}}>✓ dnes</div>}
          </div>
        </button>
        {onDetail&&<button onClick={()=>onDetail(c)} style={{background:"#EFF6FC",border:"none",borderRadius:10,padding:"10px 12px",cursor:"pointer",fontSize:16,color:OG,fontWeight:700,flexShrink:0,fontFamily:"inherit"}} title="Details">ℹ</button>}
      </div>
    );
  };
  return (
    <div className="main-panel">
      <div className="panel-header">
        <button className="back-btn" onClick={onBack}>‹</button>
        <div className="panel-header-title">Kunden auswählen</div>

        <div style={{maxWidth:580,width:"100%"}}>
          <input autoFocus placeholder="Optiker, Stadt, PLZ suchen..." value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:16}}/>
          {q.length>=1?<>
            <div className="section-label">Ergebnisse ({filtered.length})</div>
            {filtered.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#d1d5db",fontSize:16}}>Kein Optiker gefunden</div>
            :<div style={{display:"flex",flexDirection:"column",gap:8}}>{filtered.map(c=><Row key={c.id} c={c}/>)}</div>}
          </>:<>
            {nearby.length>0&&<>
              <div className="section-label">Altkunde</div>
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:24}}>{nearby.map(c=><Row key={c.id} c={c} dist={c._d}/>)}</div>
            </>}
            {nearby.length===0&&<div style={{textAlign:"center",padding:"32px 0 24px",color:"#d1d5db"}}><div style={{fontSize:36,marginBottom:10}}>🔍</div><div style={{fontSize:16}}>GPS lädt oder nicht verfügbar</div></div>}

/* ── CONFIRM ── */
function VisitConfirmScreen({user,customer,onBack,onConfirm}){
  const [pos,setPos]=useState(null); const [gpsErr,setGpsErr]=useState(null); const [gpsErrCode,setGpsErrCode]=useState(null); const [loading,setLoading]=useState(true);
  const [cityPos,setCityPos]=useState(null); const [cityLoading,setCityLoading]=useState(customer.isNew);
  const [result,setResult]=useState(""); const [units,setUnits]=useState(""); const [note,setNote]=useState("");
  const [saving,setSaving]=useState(false); const [done,setDone]=useState(false);
  useEffect(()=>{
    if(!navigator.geolocation){setGpsErr("GPS nicht verfügbar");setLoading(false);return;}
    navigator.geolocation.getCurrentPosition(
      p=>{setPos({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)});setLoading(false);},
      e=>{setGpsErrCode(e?.code||0);setGpsErr("GPS nicht verfügbar");setLoading(false);},
      {enableHighAccuracy:true,timeout:12000}
    );
  },[]);
  useEffect(()=>{
    if(!customer.isNew||!customer.city)return;
    fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(customer.city)}&format=json&limit=1&countrycodes=de,at,ch`)
      .then(r=>r.json())
      .then(d=>{if(d&&d[0])setCityPos({lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)});setCityLoading(false);})
      .catch(()=>setCityLoading(false));
  },[]);
  const dist=customer.isNew
    ?(pos&&cityPos?haversine(pos.lat,pos.lng,cityPos.lat,cityPos.lng):null)
    :(pos&&customer.lat!=null&&customer.lng!=null?haversine(pos.lat,pos.lng,customer.lat,customer.lng):null);
  const noGps=!customer.isNew&&customer.lat==null;
  const gi=customer.isNew
    ?(cityLoading
      ?{cls:"load",icon:"⏳",text:"Stadtposition wird ermittelt…",ok:true}
      :!cityPos
        ?{cls:"load",icon:"📍",text:"Stadt nicht gefunden – Besuch wird erfasst",ok:true}
        :dist===null
          ?{cls:"load",icon:"📍",text:"GPS wird ermittelt…",ok:true}
          :dist<=25000
            ?{cls:"ok",icon:"✅",text:`Neukunde · ${dist<1000?dist+" m":(dist/1000).toFixed(1)+" km"} von ${customer.city}`,ok:true}
            :{cls:"err",icon:"✗",text:`Zu weit: ${(dist/1000).toFixed(1)} km von ${customer.city} (Limit 25 km)`,ok:false})
    :customer.lat==null
      ?{cls:"load",icon:"📍",text:"Kundenstandort nicht hinterlegt – Besuch wird erfasst",ok:true}
      :gpsInfo(loading?null:dist);
  const vs=customer.isNew
    ?(dist===null?"unknown":dist<=25000?"confirmed":"rejected")
    :(noGps?(pos?"confirmed":"unknown"):dist===null?"unknown":dist<=25000?"confirmed":"rejected");
  const go=()=>{
    if(!result||saving)return; setSaving(true);
    setTimeout(()=>{onConfirm({id:Date.now(),rep_id:user.id,customer_id:customer.id,confirmed_at:new Date().toISOString(),distance:dist,status:vs,result,units:result==="order"?(parseInt(units)||0):0,note,gps_err:gpsErrCode,_cityPos:customer.isNew?cityPos:null});setDone(true);},900);
  };
  if(done) return (
    <div className="main-panel" style={{alignItems:"center",justifyContent:"center",textAlign:"center"}}>
      <div style={{padding:40}}>
        <div style={{fontSize:72,marginBottom:16}}>✅</div>
        <div style={{fontSize:28,fontWeight:900,color:"#111827",marginBottom:4}}>Gespeichert!</div>
        <div style={{fontSize:16,color:"#6b7280"}}>{customer.name}</div>
        {dist!==null&&!customer.isNew&&<div style={{fontSize:14,color:"#9ca3af",marginTop:4}}>GPS-Entfernung: {dist} m</div>}
      </div>
    </div>
  );
  return (
    <div className="main-panel">
      <div className="panel-header">
        <button className="back-btn" onClick={onBack}>‹</button>
        <div>
          <div className="panel-header-title">Besuch bestätigen</div>
          <div className="panel-header-sub">{customer.name}{customer.city?` · ${customer.city}`:""}</div>
        </div>
      </div>
      <div className="panel-body">
        <div style={{maxWidth:520,width:"100%",display:"flex",flexDirection:"column",gap:14}}>
          <div className={"gps-box "+gi.cls}>
            <div className="gps-text"><span style={{fontSize:18}}>{gi.icon}</span><span>{(!noGps&&gpsErr)||gi.text}</span></div>
            {pos&&<div style={{fontSize:14,color:"#6b7280",marginTop:4}}>GPS-Genauigkeit: ±{pos.acc} m</div>}
            {!customer.isNew&&dist!==null&&dist>300&&<div style={{fontSize:14,color:"#b91c1c",marginTop:6,fontWeight:600}}>Sie sind zu weit entfernt. Der Besuch wird zur Überprüfung markiert.</div>}
          </div>
          <div>
            <div className="section-label">Besuchsergebnis *</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {RESULTS.map(r=>(
                <button key={r.value} className={"result-btn"+(result===r.value?" active":"")} onClick={()=>setResult(r.value)}>

function RepMap({visits,custs}){
  const divRef=React.useRef(null);
  const mapRef=React.useRef(null);
  const markersRef=React.useRef([]);
  React.useEffect(()=>{
    if(!divRef.current||typeof L==='undefined') return;
    if(!mapRef.current){
      mapRef.current=L.map(divRef.current).setView([51.0,10.5],5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(mapRef.current);
    }
    markersRef.current.forEach(m=>m.remove());
    markersRef.current=[];
    const bounds=[];
    visits.forEach(v=>{
      const c=custs.find(x=>String(x.id)===String(v.customer_id));
      if(!c?.lat||!c?.lng) return;
      const ok=v.status!=='rejected';
      const color=ok?'#16a34a':'#dc2626';
      const rep=USERS.find(u=>u.id===v.rep_id);
      const popup=`<b>${c.name}</b><br><span style="color:#6b7280">${rep?.name||''}</span><br>${new Date(v.confirmed_at).toLocaleDateString('de-DE')} ${fmtT(v.confirmed_at)}<br>${rl(v.result)}${v.distance!=null&&v.distance>=0&&v.distance!==9999?'<br>📍 '+v.distance+' m':''}`;
      const m=L.circleMarker([c.lat,c.lng],{radius:8,color,fillColor:color,fillOpacity:0.85,weight:2}).bindPopup(popup);
      m.addTo(mapRef.current);
      markersRef.current.push(m);
      bounds.push([c.lat,c.lng]);
    });
    if(bounds.length>0) mapRef.current.fitBounds(bounds,{padding:[30,30]});
    else mapRef.current.setView([51.0,10.5],5);
  },[visits,custs]);
  React.useEffect(()=>()=>{if(mapRef.current){mapRef.current.remove();mapRef.current=null;}},[]);
  const withGps=visits.filter(v=>{const c=custs.find(x=>String(x.id)===String(v.customer_id));return c?.lat&&c?.lng;}).length;
  return(
    <div style={{marginTop:12}}>
      <div style={{fontSize:12,color:"#9ca3af",marginBottom:6,display:"flex",gap:16,alignItems:"center"}}>
        <span><span style={{display:"inline-block",width:10,height:10,borderRadius:"50%",background:"#16a34a",marginRight:4}}/>OK</span>
        <span><span style={{display:"inline-block",width:10,height:10,borderRadius:"50%",background:"#dc2626",marginRight:4}}/>Abgelehnt</span>
        <span style={{marginLeft:"auto"}}>{withGps} / {visits.length} mit GPS</span>
      </div>
      <div ref={divRef} style={{height:400,borderRadius:12,overflow:"hidden",border:"1px solid #f0f0f0",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}/>
    </div>
  );
}

  // Helper: export all visits to CSV
  const exportVisitsCSV=()=>{
    const hdr=["Datum","Uhrzeit","Vertreter","Kunde","PLZ","Ort","Ergebnis","GPS-Status","Distanz (m)","Notiz"];
    const rows=[...visits].sort((a,b)=>b.confirmed_at.localeCompare(a.confirmed_at)).map(v=>{
      const rep=USERS.find(u=>u.id===v.rep_id);
      const c=allCusts.find(cu=>String(cu.id)===String(v.customer_id));
      const dt=new Date(v.confirmed_at);
      return [
        dt.toLocaleDateString("de-DE"),
        dt.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
        rep?.name||v.rep_id,
        c?.name||v.customer_id,
        c?.postal||"",
        c?.city||"",
        rl(v.result),
        v.status,
        (v.distance!=null&&v.distance!==9999)?v.distance:"",
        v.note||"",
      ].map(s=>`"${String(s).replace(/"/g,'""')}"`).join(",");
    });
    const csv=[hdr.join(","),...rows].join("\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`iris_besuche_${TODAY}.csv`;a.click();
    URL.revokeObjectURL(url);
  };

/* Načte workdays z posledních 90 dní z localStorage (fallback režim) */
function loadAllLocalWorkdays(){
  const result=[];
  for(let i=0;i<90;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().split("T")[0];
    const wds=ls("actio_wd_"+ds,[]);
    result.push(...wds);
  }
  return result;
}

function App(){
  const USE_FB=window.USE_FIREBASE;
  const DB=window.db;

  const savedId=localStorage.getItem("actio_uid");
  const savedUser=savedId?USERS.find(u=>u.id===parseInt(savedId)):null;
  const [screen,setScreen]=useState(savedUser?(savedUser.role==="manager"?"dashboard":"home"):"login");
  const [user,setUser]=useState(savedUser||null);
  const [visits,setVisits]=useState(()=>{
    if(USE_FB) return [];
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);
    const cutStr=cutoff.toISOString().split("T")[0];
    return ls("actio_visits",INIT_VISITS).filter(v=>v.confirmed_at.split("T")[0]>=cutStr);
  });
  const [workdays,setWorkdays]=useState(()=>USE_FB?[]:loadAllLocalWorkdays());
  const [cust,setCust]=useState(null);
  const [detailCust,setDetailCust]=useState(null);
  const [prevScreen,setPrevScreen]=useState("home");
  const [fbLoading,setFbLoading]=useState(USE_FB);
  const [auditLogs,setAuditLogs]=useState([]);
  const [newCusts,setNewCusts]=useState(()=>{
    // fallback: načti ze všech uživatelů z localStorage
    const all=[];
    USERS.forEach(u=>{
      const k="actio_new_cust_"+u.id;
      try{const v=localStorage.getItem(k);if(v)all.push(...JSON.parse(v));}catch{}
    });
    return all;
  });

  /* ── Smaž všechny záznamy v audit_log ── */
  async function clearAuditLog(){
    if(!USE_FB||!DB) return;
    const snap=await DB.collection('audit_log').get();
    const batch=DB.batch();
    snap.docs.forEach(d=>batch.delete(d.ref));
    await batch.commit();
  }

  /* ── Firebase real-time listenery ── */
  useEffect(()=>{
    if(!USE_FB||!DB) return;
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);
    const cutStr=cutoff.toISOString().split("T")[0];

    const unsubV=DB.collection('visits').onSnapshot(snap=>{
      setVisits(snap.docs.map(d=>({...d.data(),id:d.id})).filter(v=>v.confirmed_at.split("T")[0]>=cutStr));
      setFbLoading(false);
    },err=>{console.error("[Iris] visits listener:",err);setFbLoading(false);});

    const unsubW=DB.collection('workdays').onSnapshot(snap=>{
      setWorkdays(snap.docs.map(d=>d.data()));
    },err=>{console.error("[Iris] workdays listener:",err);});

    const unsubA=DB.collection('audit_log').orderBy('timestamp','desc').limit(20).onSnapshot(snap=>{
      setAuditLogs(snap.docs.map(d=>({...d.data(),id:d.id})));
    },err=>{console.error("[Iris] audit_log listener:",err);});

    const unsubNC=DB.collection('new_customers').onSnapshot(snap=>{
      setNewCusts(snap.docs.map(d=>({...d.data(),id:d.id})));
    },err=>{console.error("[Iris] new_customers listener:",err);});

    return()=>{unsubV();unsubW();unsubA();unsubNC();};
  },[]);

  /* ── localStorage persistence (jen v fallback režimu) ── */
  useEffect(()=>{
    if(USE_FB) return;
    localStorage.setItem("actio_visits",JSON.stringify(visits));
  },[visits]);
  useEffect(()=>{
    if(USE_FB) return;
    const byDate={};
    workdays.forEach(w=>{if(!byDate[w.date])byDate[w.date]=[];byDate[w.date].push(w);});
    Object.entries(byDate).forEach(([date,wds])=>localStorage.setItem("actio_wd_"+date,JSON.stringify(wds)));
  },[workdays]);

  const goDetail=c=>{setPrevScreen(screen);setDetailCust(c);setScreen("custdetail");};
  const login=u=>{localStorage.setItem("actio_uid",u.id);setUser(u);setScreen(u.role==="manager"?"dashboard":"home");};
  const logout=()=>{localStorage.removeItem("actio_uid");setUser(null);setScreen("login");};

  const addVisit=v=>{
    const {_cityPos,...vClean}=v;
    if(_cityPos&&String(v.customer_id).startsWith("new_")){
      editNewCustomer(v.customer_id,{lat:_cityPos.lat,lng:_cityPos.lng});
    }
    if(USE_FB&&DB){
      const {id:_,...data}=vClean;
      DB.collection('visits').add(data).catch(e=>console.error("[Iris] addVisit:",e));
    } else {
      setVisits(p=>[vClean,...p]);
    }
    setScreen("home");
  };
  const deleteVisit=id=>{
    if(USE_FB&&DB){
      DB.collection('visits').doc(String(id)).delete().catch(e=>console.error("[Iris] deleteVisit:",e));
    } else {
      setVisits(p=>p.filter(v=>v.id!==id));
    }
  };
  const editVisit=(id,changes)=>{
    if(USE_FB&&DB){
      DB.collection('visits').doc(String(id)).update(changes).catch(e=>console.error("[Iris] editVisit:",e));
    } else {
      setVisits(p=>p.map(v=>v.id===id?{...v,...changes}:v));
    }
  };
  const deleteVisitAudit=(id,before)=>{
    if(USE_FB&&DB){
      const safeBefore=JSON.parse(JSON.stringify(before));
      DB.collection('audit_log').add({repEmail:user.email,action:'deleted',timestamp:Date.now(),visitId:String(id),before:safeBefore,after:null}).catch(e=>console.error("[Iris] auditLog:",e));
      DB.collection('visits').doc(String(id)).delete().catch(e=>console.error("[Iris] deleteVisitAudit:",e));
    } else {
      setVisits(p=>p.filter(v=>v.id!==id));
    }
  };
  const editVisitAudit=(id,changes,before)=>{
    if(USE_FB&&DB){
      DB.collection('audit_log').add({repEmail:user.email,action:'edited',timestamp:Date.now(),visitId:String(id),before,after:{...before,...changes}}).catch(e=>console.error("[Iris] auditLog:",e));
      DB.collection('visits').doc(String(id)).update(changes).catch(e=>console.error("[Iris] editVisitAudit:",e));
    } else {
      setVisits(p=>p.map(v=>v.id===id?{...v,...changes}:v));
    }
  };

  /* ── New customers CRUD ── */
  const addNewCustomer=nc=>{
    if(USE_FB&&DB){
      DB.collection('new_customers').doc(nc.id).set(nc).catch(e=>console.error("[Iris] addNewCustomer:",e));
    } else {
      setNewCusts(p=>[nc,...p.filter(c=>c.id!==nc.id)]);
      // fallback: uložit do localStorage pro konkrétního usera
      const k="actio_new_cust_"+nc.rep_id;
      try{const prev=JSON.parse(localStorage.getItem(k)||"[]");localStorage.setItem(k,JSON.stringify([nc,...prev.filter(c=>c.id!==nc.id)]));}catch{}
    }
  };
  const editNewCustomer=(id,changes)=>{
    if(USE_FB&&DB){
      DB.collection('new_customers').doc(String(id)).update(changes).catch(e=>console.error("[Iris] editNewCustomer:",e));
    } else {
      setNewCusts(p=>p.map(c=>c.id===id?{...c,...changes}:c));
    }
  };

  const myWorkday=user?workdays.find(w=>w.user_id===user.id&&w.date===TODAY):null;

  const saveWorkday=wd=>{
    const wdData={...wd,id:Date.now()};
    if(USE_FB&&DB){
      const docId=`${wd.user_id}_${wd.date}`;
      DB.collection('workdays').doc(docId).set(wdData).catch(e=>console.error("[Iris] saveWorkday:",e));
      /* Optimistický update — okamžitá odezva UI */
      setWorkdays(p=>[...p.filter(w=>!(w.user_id===wd.user_id&&w.date===wd.date)),wdData]);
    } else {
      setWorkdays(p=>[...p.filter(w=>!(w.user_id===user.id&&w.date===TODAY)),wdData]);
    }
    setScreen("home");
  };
  const saveOvernight=overnight=>{
    if(USE_FB&&DB){
      const docId=`${user.id}_${TODAY}`;
      DB.collection('workdays').doc(docId).update({overnight}).catch(e=>console.error("[Iris] saveOvernight:",e));
    }
    setWorkdays(p=>p.map(w=>(w.user_id===user.id&&w.date===TODAY)?{...w,overnight}:w));
    setScreen("home");
  };

  if(fbLoading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#232323",color:"rgba(255,255,255,.75)",fontSize:16,fontWeight:700,fontFamily:"Montserrat,sans-serif",gap:12}}>⏳ Verbindung wird hergestellt…</div>;
  if(screen==="login") return <LoginScreen onLogin={login}/>;

  return (
    <div className="app-root">
      <Sidebar user={user} workday={myWorkday} visits={visits} onLogout={logout} onSetDay={()=>setScreen("dayset")}/>
      {screen==="home"       && <HomeScreen user={user} visits={visits} workday={myWorkday} newCusts={newCusts} onNewVisit={()=>setScreen("search")} onSetOvernight={()=>setScreen("overnight")} onDeleteVisit={deleteVisit} onEditVisit={editVisit} onEditNewCust={editNewCustomer} onDeleteVisitAudit={deleteVisitAudit} onEditVisitAudit={editVisitAudit} onCustDetail={goDetail}/>}
      {screen==="dayset"     && <DaySetupScreen user={user} existing={myWorkday} onBack={()=>setScreen("home")} onSave={saveWorkday}/>}
      {screen==="overnight"  && <OvernightScreen workday={myWorkday} onBack={()=>setScreen("home")} onSave={saveOvernight}/>}
      {screen==="search"     && <CustomerSearchScreen user={user} visits={visits} newCusts={newCusts} onBack={()=>setScreen("home")} onSelect={c=>{setCust(c);setScreen("confirm");}} onNewCustomer={()=>setScreen("neukunde")} onDetail={goDetail}/>}
      {screen==="neukunde"   && <NewCustomerScreen user={user} onBack={()=>setScreen("search")} onSave={c=>{addNewCustomer(c);setCust(c);setScreen("confirm");}}/>}
      {screen==="confirm"    && <VisitConfirmScreen user={user} customer={cust} onBack={()=>setScreen("search")} onConfirm={addVisit}/>}
      {screen==="dashboard"  && <DashboardScreen visits={visits} workdays={workdays} auditLogs={auditLogs} newCusts={newCusts} clearAuditLog={clearAuditLog}/>}
      {screen==="custdetail" && <CustomerDetailScreen user={user} customer={detailCust} visits={visits} onBack={()=>setScreen(prevScreen)}/>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
<script>
// PWA icon + manifest
(function(){
  // Generate icon via canvas
  const c=document.createElement("canvas");
  c.width=c.height=512;
  const ctx=c.getContext("2d");
  // Dark rounded background (same as sidebar #232323)
  const r=90;
  ctx.fillStyle="#232323";
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(512-r,0);ctx.quadraticCurveTo(512,0,512,r);
  ctx.lineTo(512,512-r);ctx.quadraticCurveTo(512,512,512-r,512);
  ctx.lineTo(r,512);ctx.quadraticCurveTo(0,512,0,512-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();ctx.fill();
  // Subtle circle decoration (like sidebar ::before)
  ctx.fillStyle="rgba(255,255,255,.07)";
  ctx.beginPath();ctx.arc(420,90,200,0,Math.PI*2);ctx.fill();
  // "Iris" centered
  ctx.fillStyle="white";
  ctx.font="bold 140px Montserrat,Arial,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("Iris",256,256);
  const iconUrl=c.toDataURL("image/png");
  document.getElementById("pwa-icon").href=iconUrl;
  // Manifest
  const m={name:"Iris – Prague Eyewear",short_name:"Iris",start_url:"/",display:"standalone",background_color:"#232323",theme_color:"#232323",icons:[{src:iconUrl,sizes:"512x512",type:"image/png"}]};
  const url=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/json"}));
  document.getElementById("pwa-manifest").href=url;
})();
</script>
</body>
</html>
